<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#060607}
.halo{position:absolute;left:150px;top:90px;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle at 70% 40%,rgba(252,126,21,.35),transparent 55%),radial-gradient(circle at 25% 60%,rgba(47,123,255,.3),transparent 55%)}
.portrait{position:absolute;left:170px;top:110px;width:660px;height:660px;background:url(../assets/img/portrait.png) center/cover;border-radius:50%}
.kbis{position:absolute;left:1360px;top:80px;width:540px;height:860px;background:url(../assets/img/kbis-documents.png) 0 0/540px auto no-repeat;
  transform:rotate(7deg);filter:drop-shadow(0 40px 80px rgba(0,0,0,.8)) blur(2.5px) brightness(.85)}
.year{position:absolute;left:870px;top:60px;font:900 260px/1 "Big Shoulders";color:rgba(255,255,255,.06);letter-spacing:4px}
.big{position:absolute;left:880px;top:250px;font:900 170px/.95 "Big Shoulders";color:#fff;letter-spacing:2px;text-transform:uppercase}
.big b{color:var(--accent);font-weight:900}
.name{position:absolute;left:885px;top:600px;font:800 54px Montserrat;color:#fff}
.name b{color:var(--accent)}
.fly{position:absolute;left:760px;top:700px;font:900 230px "Big Shoulders";color:var(--accent);filter:blur(14px);opacity:.5;transform:scale(1.2)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 64%,rgba(0,0,0,.85));z-index:30}
</style></head><body><div class="stage">
<div class="year">2010</div>
<div class="kbis"></div>
<div class="halo"></div><div class="portrait"></div>
<div class="big">21 ans<br><b>3 000 €</b></div>
<div class="name">Guillaume <b>Herbin</b></div>
<div class="shade"></div><div class="vignette"></div><div class="grain"></div>
<div class="sub">Je me suis lancé à 21 ans, avec<span class="box">3 000 €</span>en poche.</div>
<div class="label">C2 · 34,2 s</div>
</div></body></html>
