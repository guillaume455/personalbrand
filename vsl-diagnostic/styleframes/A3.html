<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#141416}
.glow{position:absolute;left:300px;top:-100px;width:1400px;height:1100px;background:radial-gradient(ellipse,rgba(252,126,21,.22),transparent 60%)}
.shot{position:absolute;left:-820px;top:-730px;width:3072px;height:2048px;background:url(../assets/img/plan-lancement.png) 0 0/3072px 2048px;

.mask2{position:absolute;right:0;top:0;width:520px;height:1080px;background:linear-gradient(270deg,#141416 30%,transparent)}
.two{position:absolute;left:1180px;top:430px;font:900 300px "Big Shoulders";color:var(--accent);filter:blur(10px);opacity:.85;transform:scale(1.15)}
