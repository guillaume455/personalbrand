  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "07-metier", DUR = 4.1, FR = 1 / 30;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#f07-" + id); }

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- name letters (converge) ---- */
      function letters(host, word) {
        var out = [];
        for (var i = 0; i < word.length; i++) { var s = document.createElement("span"); s.className = "f07-l"; s.textContent = word.charAt(i); host.appendChild(s); out.push(s); }
        return out;
      }
      var L1 = letters($("n1"), "Guillaume"), L2 = letters($("n2"), "Herbin");

      /* ================= scene 1 (0.00 → 2.00) : the route draws ================= */
      var gcam = $("gcam"), dive = $("dive");
      // handoff_in : GPS at x0.92 centred, no route drawn
      gsap.set(gcam, { scale: 0.92, x: 0, transformOrigin: "960px 540px" });
      // camera : push 0.92 → 0.98 and drift (camera right) 25 px/s, following the tip
      ft(gcam, { scale: 0.92, x: 0 }, { scale: 0.98, x: -50, duration: 2.0, ease: "none" }, 0);

      // route draw : 0.30 → 1.90, one sure gesture (power2.inOut)
      var route = $("route"), routeg = $("routeg"), tip = $("tip");
      var LEN = route.getTotalLength();
      [route, routeg].forEach(function (p) { p.style.strokeDasharray = LEN + " " + (LEN + 40); p.style.strokeDashoffset = LEN; });
      var D0 = 0.30, DD = 1.60, ease = gsap.parseEase("power2.inOut");
      ft([route, routeg], { strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: DD, ease: "power2.inOut" }, D0);
      // glow riding the tip
      var prox = { p: 0 };
      function placeTip() { var pt = route.getPointAtLength(prox.p * LEN); tip.setAttribute("cx", pt.x); tip.setAttribute("cy", pt.y); }
      placeTip();
      ft(prox, { p: 0 }, { p: 1, duration: DD, ease: "power2.inOut", onUpdate: placeTip }, D0);
      ft(tip, { opacity: 0 }, { opacity: 0.85, duration: 0.15, ease: "power1.out" }, D0);
      ft(tip, { opacity: 0.85 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, D0 + DD);

      // waypoints light as the tip passes them ; arrival at the end of the draw
      function passTime(x, y) {
        var best = 0, bd = 1e9;
        for (var s = 0; s <= 400; s++) { var pt = route.getPointAtLength(LEN * s / 400), d = (pt.x - x) * (pt.x - x) + (pt.y - y) * (pt.y - y); if (d < bd) { bd = d; best = s / 400; } }
        var lo = 0, hi = 1;
        for (var k = 0; k < 40; k++) { var m = (lo + hi) / 2; if (ease(m) < best) lo = m; else hi = m; }
        return D0 + DD * lo;
      }
      [["wp1", passTime(760, 500)], ["wp2", passTime(1230, 330)], ["end", D0 + DD]].forEach(function (w) {
        ft($(w[0]), { opacity: 0, scale: 1.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power3.out" }, w[1]);
      });

      // glass reflection (foreground) : appears, then slides slowly
      ft($("sheen"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.2);
      ft($("sheen"), { x: -60 }, { x: 80, duration: 2.4, ease: "none" }, 0.2);

      /* ================= scene 2 (2.00 → 4.10) : dive into the blue point, Guillaume ================= */
      // dot screen position at 2.00 (gcam scale .98, x -50) ; dive aims it to the frame centre
      var G = 0.98, GX = -50, DOT = { x: 330, y: 700 };
      var sx = 960 + G * (DOT.x - 960) + GX, sy = 540 + G * (DOT.y - 540);
      var TX = (960 - sx) / G, TY = (540 - sy) / G;
      var RING_R = 282, LAND = 4.0;                          // ring scale when it covers the frame
      var S_DIVE = (RING_R * LAND) / (29 * G);               // dot outer radius (26 + 3) matches the ring outer radius
      gsap.set(dive, { transformOrigin: DOT.x + "px " + DOT.y + "px" });
      // 2.00 → 2.15 one notch back ; 2.15 → 2.60 plunge (power3.in)
      ft(dive, { scale: 1 }, { scale: 0.96, duration: 0.15, ease: "power2.out" }, 2.0);
      ft(dive, { scale: 0.96, x: 0, y: 0 }, { scale: S_DIVE, x: TX, y: TY, duration: 0.45, ease: "power3.in" }, 2.15);
      // 2.60 the dot covers the frame : the GPS is swapped for the identical dot of the ring (invisible cut)
      var ring = $("ring"), PX0 = 30;
      tl.set($("gps"), { opacity: 0 }, 2.60);
      tl.set(ring, { opacity: 1 }, 2.60);
      // landing 2.60 → 2.90 (expo.out) : the dot shrinks to the ring place (centre 500,465)
      ft(ring, { scale: LAND, x: 960 - 500 - PX0, y: 540 - 465 }, { scale: 1, x: 0, y: 0, duration: 0.3, ease: "expo.out" }, 2.60);
      // scale-swap 0.2 s : blue dot + white ring → orange and blue ring of the portrait
      ft($("rdot"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.86, duration: 0.2, ease: "power2.in" }, 2.60);
      ft($("rin"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 2.62);
      // the halos follow
      ft($("halo"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 2.60);
      ft($("ph"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 2.60);
      // portrait stage drift : camera right 20 px/s, lands on handoff_out at 4.10
      ft($("pcam"), { x: PX0 }, { x: 0, duration: DUR - 2.60, ease: "none" }, 2.60);
      // 2.80 the real portrait lands in the ring (x1.2 blur 8 → sharp)
      ft($("portrait"), { opacity: 0, scale: 1.2, filter: "blur(8px)", transformOrigin: "329.5px 355px" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 2.80);
      // foreground particles
      ft($("fgp"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 2.70);
      ft($("fgp"), { y: 0 }, { y: -14, duration: DUR - 2.70, ease: "none" }, 2.70);

      // name : letters converge (3.50 Guillaume, 3.77 Herbin)
      function converge(arr, t0) {
        var c = (arr.length - 1) / 2;
        arr.forEach(function (el, i) {
          ft(el, { opacity: 0, x: (i - c) * 22, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, t0 + Math.abs(i - c) * 0.012);
        });
      }
      converge(L1, 3.50 - FR);
      converge(L2, 3.77 - FR);

      /* ---- the voice line : word by word, 35 % white then white ; one key-word box per sentence ---- */
      Array.prototype.forEach.call(root.querySelectorAll(".f07-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f07-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
