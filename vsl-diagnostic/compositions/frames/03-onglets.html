      var t1 = $("t1"), t2 = $("t2"), t3 = $("t3");

      var pA = $("paudi"), pF = $("pford"), pL = $("plac");
      function newTab(tab, page, at) {
        tl.set(tab, { opacity: 1 }, at);
        ft(tab, { y: 10, scale: 0.92, transformOrigin: "50% 100%" }, { y: 0, scale: 1, duration: 0.18, ease: "expo.out" }, at);
        tl.set(page, { opacity: 1 }, at);
        ft(page, { y: 36, scale: 1.15, filter: "blur(8px)", transformOrigin: "50% 30%" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, at);
      }
      // 0.30 the Ford page slides over in a new tab
      tl.set(on1, { opacity: 0 }, 0.30); tl.set(on2, { opacity: 1 }, 0.30);
      newTab(t2, pF, 0.30);
      // 0.70 La Centrale home slides in turn
      tl.set(on2, { opacity: 0 }, 0.70); tl.set(on3, { opacity: 1 }, 0.70);
      newTab(t3, pL, 0.70);
      // 0.95 the Ford comes back to the front
      tl.set(on3, { opacity: 0 }, 0.95); tl.set(on2, { opacity: 1 }, 0.95);
      tl.set(pF, { zIndex: 5 }, 0.95);
      ft(pF, { x: 48, scale: 1.03, filter: "blur(5px)" }, { x: 0, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, 0.95);

      /* ---------- the price tag falls into the balance card ---------- */
      var tag = $("tag"), card = $("card");
      // t=0 : text box top-left at (1127.7, 318.6), 1800 px/s toward −35°, directional blur 10 px (frame 02's last state)
      var ANG = -35, FLY0 = { x: 955.7 + 210 * Math.cos(ANG * Math.PI / 180), y: 439 + 210 * Math.sin(ANG * Math.PI / 180) };
      gsap.set($("flab"), { scale: S02 });
      gsap.set($("frot"), { rotation: ANG, width: 760, height: 150 });
      gsap.set($("finn"), { rotation: -ANG });
      gsap.set(tag, { transformOrigin: "0px 0px" });
      ft(tag, { x: FLY0.x }, { x: 1560, duration: 0.8, ease: "power3.out" }, 0);
      ft(tag, { y: FLY0.y }, { y: 164, duration: 0.3, ease: "power2.out" }, 0);
      ft(tag, { y: 164 }, { y: 184, duration: 0.3, ease: "power2.in" }, 0.30);
      ft(tag, { scale: 1 }, { scale: 0.5, duration: 0.4, ease: "power2.inOut" }, 0.08);
      var mb = $("mbb"), mbp = { v: 10 };
      function wmb() { mb.setAttribute("stdDeviation", mbp.v.toFixed(2) + " 0"); }
      ft(mbp, { v: 10 }, { v: 0, duration: 0.3, ease: "power2.out", onUpdate: wmb }, 0);
      ft(tag, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(5px)", duration: 0.1, ease: "power2.in" }, 0.44);
      // the orange reflection of frame 02 dims away
      ft($("fgo"), { opacity: 0.5 }, { opacity: 0, duration: 0.4, ease: "power1.out" }, 0.25);
      // the card arrives just before (dark glass, top right)
      tl.set(card, { opacity: 1 }, 0.16);
      ft(card, { y: -26, scale: 1.08, filter: "blur(8px)", opacity: 0 }, { y: 0, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.22, ease: "expo.out" }, 0.16);
      // it absorbs the tag : accent flash
      ft($("glow"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, 0.50);
      ft($("glow"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0.60);
      // the tag becomes the balance : the numeral condenses out of it (x1.15 blur 6 → sharp)
      ft($("numw"), { opacity: 0, scale: 1.15, filter: "blur(6px)", transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, 0.50);

      // 1.35 → 1.82 the balance rolls 12 400 € → 4 150 € (tabular, slight shrink)
      var num = $("num"), bal = { v: 12400 };
      function fmt(v) { var r = Math.round(v / 10) * 10, s = String(r); return (s.length > 3 ? s.slice(0, s.length - 3) + " " + s.slice(-3) : s) + " €"; }
      tl.fromTo(bal, { v: 12400 }, { v: 4150, duration: 0.47, ease: "power3.out", immediateRender: false,
        onUpdate: function () { num.textContent = fmt(bal.v); } }, 1.35);
      ft(num, { scale: 1 }, { scale: 0.92, duration: 0.47, ease: "power3.out" }, 1.35);

      // 2.30 the push passes the card : it leaves past the camera (faster than it came)
      ft(card, { x: 0, y: 0, scale: 1, filter: "blur(0px)", opacity: 1 }, { x: 240, y: -170, scale: 1.4, filter: "blur(10px)", opacity: 0, duration: 0.2, ease: "power3.in" }, 2.30);

      /* ---------- scene 2 : the silent gag ---------- */
      // depth : the Ford page goes soft, its seller card stays sharp (pixel-identical copy)
      tl.set($("crop"), { opacity: 1 }, 2.30);
      ft(pF, { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.4, ease: "expo.out" }, 2.30);

      var CS = 0.43, TIP = { x: 9.5 * CS, y: 6.3 * CS };
      function at(P) { return { x: P.x - TIP.x, y: P.y - TIP.y }; }
      var PX = 1 / (2.2 * N1);                  // one screen px in world units at A2
      var S1 = { x: BTN.x - 8, y: BTN.y + 4 }, S2 = { x: S1.x - 60 * PX, y: S1.y }, S3 = { x: S2.x + 90 * PX, y: S2.y };
      var START = { x: BTN.x + 700, y: BTN.y + 520 };
      var curw = $("curw"), cur = $("cur");
      gsap.set([curw, $("gh1"), $("gh2")], { scale: CS, transformOrigin: "0px 0px" });
      gsap.set(cur, { transformOrigin: "9.5px 6.3px" });
      gsap.set(curw, { x: at(START).x, y: at(START).y });
      gsap.set($("gh1"), { x: at(S1).x, y: at(S1).y });
      gsap.set($("gh2"), { x: at(S2).x, y: at(S2).y });

      // 2.18 → 2.62 it arrives in one curve on « Envoyer un message » and stops
      tl.set(curw, { opacity: 1 }, 2.18);
      ft(curw, { x: at(START).x }, { x: at(S1).x, duration: 0.44, ease: "power2.out" }, 2.18);
      ft(curw, { y: at(START).y }, { y: at(S1).y, duration: 0.44, ease: "power3.out" }, 2.18);
      // the three stops (the gag, the only hesitation of the film) ; the button lights on hover then dims
      var hov = $("hov");
      function hoverOn(t) { ft(hov, { opacity: 0 }, { opacity: 0.16, duration: 0.1, ease: "power2.out" }, t); }
      function hoverOff(t) { ft(hov, { opacity: 0.16 }, { opacity: 0, duration: 0.08, ease: "power2.in" }, t); }
      hoverOn(2.60);
      hoverOff(2.96);
      ft(curw, { x: at(S1).x }, { x: at(S2).x, duration: 0.14, ease: "power3.out" }, 3.00);
      ft($("gh1"), { opacity: 0.38 }, { opacity: 0.12, duration: 0.85, ease: "power1.in" }, 3.00);
      hoverOn(3.04);
      hoverOff(3.36);
      ft(curw, { x: at(S2).x }, { x: at(S3).x, duration: 0.16, ease: "power3.out" }, 3.40);
      ft($("gh2"), { opacity: 0.38 }, { opacity: 0.14, duration: 0.45, ease: "power1.in" }, 3.40);
      hoverOn(3.44);
      hoverOff(3.82);
      ft([$("gh1"), $("gh2")], { opacity: function (i) { return i ? 0.14 : 0.12; } }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.85);
      // 3.85 → 4.25 one gesture up to the × of the Ford tab
      var XC = at(XBTN);
      ft(curw, { x: at(S3).x }, { x: XC.x, duration: 0.4, ease: "power3.out" }, 3.85);
      ft(curw, { y: at(S3).y }, { y: XC.y, duration: 0.4, ease: "power2.out" }, 3.85);
      // 4.30 click on the × : press + accent ripple
      ft(cur, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.in" }, 4.27);
      ft(cur, { scale: 0.85 }, { scale: 1, duration: 0.06, ease: "power2.out" }, 4.33);
      var rp = [$("rip1"), $("rip2")];
      gsap.set(rp, { x: XBTN.x - 20, y: XBTN.y - 20 });
      tl.set(rp, { opacity: 1 }, 4.30);
      ft(rp[0], { scale: 0.3, opacity: 1 }, { scale: 3.6, opacity: 0, duration: 0.5, ease: "power2.out" }, 4.30);
      ft(rp[1], { scale: 0.3, opacity: 1 }, { scale: 3.6, opacity: 0, duration: 0.5, ease: "power2.out" }, 4.37);
      ft(curw, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.in" }, 4.42);

      // 4.35 → 4.55 the three tabs close in cascade (0.1 s apart), each page with its tab
      [[t2, [pF, $("crop")], 4.35], [t3, [pL], 4.45], [t1, [pA], 4.55]].forEach(function (c) {
        ft(c[0], { scale: 1, opacity: 1, transformOrigin: "50% 100%" }, { scale: 0.7, opacity: 0, duration: 0.1, ease: "power3.in" }, c[2]);
        ft(c[1], { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power2.in" }, c[2]);
      });
      ft($("bar"), { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power2.in" }, 4.55);

      // 4.65 → 5.15 the blank page folds toward the centre into a 760 x 980 sheet, white → cream, −4°
      var TL_ = toScreen({ x: 340, y: 74 }, K3, N1, DX1, DZ1), BR_ = toScreen({ x: 1580, y: 896 }, K3, N1, DX1, DZ1);
      var PW = BR_.x - TL_.x, PH = BR_.y - TL_.y, PC = { x: (TL_.x + BR_.x) / 2, y: (TL_.y + BR_.y) / 2 };
      var FALL = 300 * 0.5;                      // 300 px/s carried through the seam
      var fall = $("fall"), sheet = $("sheet");
      tl.set(fall, { opacity: 1 }, 4.65);
      tl.set(lens, { opacity: 0 }, 4.66);
      ft(fall, { y: -FALL }, { y: 0, duration: 0.5, ease: "none" }, 4.65);
      ft(sheet, { x: PC.x - 960, y: PC.y - 540 + FALL, scaleX: PW / 760, scaleY: PH / 980, rotation: 0 },
        { x: 0, y: 0, scaleX: 1, scaleY: 1, rotation: -4, duration: 0.5, ease: "power3.out" }, 4.65);
      ft(fall, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.4, ease: "power1.in" }, 4.75);
      ft($("cream"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 4.72);
      ft($("halo-s"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 4.55);

      /* ---------- the voice line : word by word, 35 % white then white ; one key-word box ---------- */
      Array.prototype.forEach.call(root.querySelectorAll(".f03-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f03-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
      });
      ft($("kb1"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.80 - FR);
      // the bottom shade comes with the subtitle, both leave before the silence
      ft($("shade"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.08);
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.16);
      ft($("shade"), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.out" }, 2.16);

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
