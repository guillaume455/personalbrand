  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "02-annonce", DUR = 5.05, FR = 1 / 30;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#f02-" + id); }

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ================= handoff_in : rebuild the pilot's last image (3.80) ================= */
      var P_DEND = 1 + 0.015 * (3.8 - 0.3);
      var P_S = (1.2 * 1920) / (460 * P_DEND);
      var P_DX = 960 - 460, P_DY = (470 + 70 / P_DEND) - 660;
      gsap.set($("ccam"), { scale: P_DEND, transformOrigin: "960px 470px" });
      gsap.set($("cpush"), { scale: P_S, x: P_DX, y: P_DY, transformOrigin: "460px 660px" });
      // the card keeps travelling toward the lens and dissolves (born in frame 1, alive on images 0 and 1)
      ft($("cfly"), { scale: 1 }, { scale: 1.7, duration: 0.26, ease: "power2.out" }, 0);
      ft($("cfly"), { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, 2 * FR);

      /* ================= camera : screen = Q + s * (P + T - Q), P in listing pixels ================= */
      var Q = { x: 960, y: 440 };
      var cam = $("cam"), mv = $("move"), lens = $("lens");
      function T(F) { return { x: Q.x - F.x, y: Q.y - F.y }; }
      var S1 = 0.95 * 1.15, S2 = 0.95 * 1.6, S3 = 0.95 * 2;
      var T1 = T({ x: 684, y: 700 });                    // photos + title
      var T1b = { x: T1.x - 6 / S1, y: T1.y };           // drift x +12 px/s (0.30 → 0.80)
      var T2 = T({ x: 330, y: 1200 });                   // the date line
      var S2b = S2 * (1 + 0.01 * (2.55 - 1.2));          // drift z +1 %/s
      var T3 = T({ x: 148 + (960 - 691) / S3, y: 1190 + (440 - 515) / S3 });   // A1 : old price centre-left
      var T3b = { x: T3.x - 16.5 / S3, y: T3.y };        // drift x +10 px/s (3.05 → 4.70)
      var T4 = { x: T3b.x - 50, y: T3b.y + 30 };         // pan up-right (expo.in)

      gsap.set(cam, { scale: S1 * 0.75, transformOrigin: Q.x + "px " + Q.y + "px" });
      gsap.set(mv, { x: T1.x, y: T1.y });
      gsap.set(lens, { filter: "blur(12px)" });

      // 0.00 → 0.30 landing (zoom-through forward, expo.out), blur 12 → 0
      ft(cam, { scale: S1 * 0.75 }, { scale: S1, duration: 0.3, ease: "expo.out" }, 0);
      ft(lens, { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 0);
      // 0.30 → 0.80 drift x
      ft(mv, { x: T1.x }, { x: T1b.x, duration: 0.5, ease: "none" }, 0.3);
      // 0.80 → 1.20 down to the date (expo.inOut, scale 1.6)
      ft(cam, { scale: S1 }, { scale: S2, duration: 0.4, ease: "expo.inOut" }, 0.8);
      ft(mv, { x: T1b.x, y: T1b.y }, { x: T2.x, y: T2.y, duration: 0.4, ease: "expo.inOut" }, 0.8);
      // 1.20 → 2.55 drift z
      ft(cam, { scale: S2 }, { scale: S2b, duration: 1.35, ease: "none" }, 1.2);
      // 2.55 → 3.05 up to the price (A1, scale 2)
      ft(cam, { scale: S2b }, { scale: S3, duration: 0.5, ease: "expo.inOut" }, 2.55);
      ft(mv, { x: T2.x, y: T2.y }, { x: T3.x, y: T3.y, duration: 0.5, ease: "expo.inOut" }, 2.55);
      // 3.05 → 4.70 drift x
      ft(mv, { x: T3.x }, { x: T3b.x, duration: 1.65, ease: "none" }, 3.05);
      // 4.70 → 5.05 pan up-right, expo.in, blur 0 → 10
      ft(mv, { x: T3b.x, y: T3b.y }, { x: T4.x, y: T4.y, duration: 0.35, ease: "expo.in" }, 4.7);
      ft(lens, { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.35, ease: "expo.in" }, 4.7);

      /* ================= scene 1 : the model and the months ================= */
      // 0.20 the sticker stamps (x1.4 blur 6 → sharp, 0.16 s, -3°)
      var tag = $("tag");
      tl.set(tag, { opacity: 1 }, 0.2);
      ft(tag, { scale: 1.4, rotation: -3, filter: "blur(6px)", transformOrigin: "50% 50%" }, { scale: 1, rotation: -3, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, 0.2);
      // 0.80 → 1.20 depth : the sticker and the photo bottom go soft as the camera goes down
      ft(tag, { filter: "blur(0px)" }, { filter: "blur(3px)", duration: 0.4, ease: "power2.inOut" }, 0.8);
      ft($("fgph"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 0.8);
      // 2.55 → 3.05 back in focus band ; the photo bottom stays soft at the top
      // 1.30 → 1.85 the date rolls : each label slides up in 0.12 s with a vertical blur
      var vb = document.getElementById("f02-vbb"), vbp = { v: 0 };
      function wvb() { vb.setAttribute("stdDeviation", "0 " + vbp.v.toFixed(2)); }
      wvb();
      var rolls = [["d0", "d1", 1.30], ["d1", "d2", 1.515], ["d2", "d3", 1.73]];
      rolls.forEach(function (r) {
        var a = $(r[0]), b = $(r[1]), t = r[2];
        ft(a, { y: 0 }, { y: -34, duration: 0.12, ease: "power3.in" }, t);
        tl.set(b, { opacity: 1 }, t);
        ft(b, { y: 34 }, { y: 0, duration: 0.12, ease: "power3.out" }, t);
        ft(vbp, { v: 0 }, { v: 2.6, duration: 0.06, ease: "power2.in", onUpdate: wvb }, t);
        ft(vbp, { v: 2.6 }, { v: 0, duration: 0.06, ease: "power2.out", onUpdate: wvb }, t + 0.06);
      });

      /* ================= scene 2 : the car and the margin ================= */
      // 3.02 the photo slides one notch (next photo, 0.2 s)
      ft($("strip"), { x: 0 }, { x: -613, duration: 0.2, ease: "power3.out" }, 3.02);
      // 3.84 accent stroke strikes « 86 900 € » (0.18 s)
      var st = $("strike");
      tl.set(st, { opacity: 1 }, 3.84);
      ft(st, { scaleX: 0, rotation: -3 }, { scaleX: 1, rotation: -3, duration: 0.18, ease: "power2.out" }, 3.84);
      // 4.05 the new price arrives too big and blurred from the camera (x1.6 blur 9 → x1 sharp, 0.28 s expo.out)
      var np = $("np");
      tl.set(np, { opacity: 1 }, 4.05);
      ft(np, { scale: 1.6, filter: "blur(9px)", transformOrigin: "0% 80%" }, { scale: 1, filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, 4.05);
      // 4.33 « Baisse de prix » pill (x1.2 blur 4 → sharp, 0.14 s)
      var pill = $("pill");
      tl.set(pill, { opacity: 1 }, 4.33);
      ft(pill, { scale: 1.2, filter: "blur(4px)", transformOrigin: "20% 50%" }, { scale: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, 4.33);

      // 4.70 → 5.05 the green price label leaves the page toward the top right (power3.in, 1800 px/s at 5.05, motion blur 10 px)
      var NP = { x: 296, y: 1150 };
      var sx = Q.x + S3 * (NP.x + T3b.x - Q.x), sy = Q.y + S3 * (NP.y + T3b.y - Q.y);
      var ANG = -35 * Math.PI / 180, FLY_T = 0.35, FLY_D = 1800 * FLY_T / 3;
      var fpos = $("fpos");
      gsap.set(fpos, { x: sx, y: sy });
      gsap.set($("flab"), { scale: S3 });
      gsap.set($("frot"), { rotation: ANG * 180 / Math.PI, width: 760, height: 150 });
      gsap.set($("finn"), { rotation: -ANG * 180 / Math.PI });
      tl.set(np, { opacity: 0 }, 4.7);
      tl.set(fpos, { opacity: 1 }, 4.7);
      ft(fpos, { x: sx, y: sy }, { x: sx + FLY_D * Math.cos(ANG), y: sy + FLY_D * Math.sin(ANG), duration: FLY_T, ease: "power3.in" }, 4.7);
      var mb = document.getElementById("f02-mbb"), mbp = { v: 0 };
      function wmb() { mb.setAttribute("stdDeviation", mbp.v.toFixed(2) + " 0"); }
      wmb();
      ft(mbp, { v: 0 }, { v: 10, duration: FLY_T, ease: "power3.in", onUpdate: wmb }, 4.7);

      /* ================= the voice line (pilot implementation) ================= */
