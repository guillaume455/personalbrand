    (function () {

        function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
        function dist(a, b) { return Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1])); }
        for (var i = 0; i < n; i++) {
          var p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
          var a = lerp(p1, p0, r / dist(p1, p0)), b = lerp(p1, p2, r / dist(p1, p2));
          d += (i === 0 ? "M" : "L") + a[0].toFixed(1) + "," + a[1].toFixed(1) + " Q" + p1[0] + "," + p1[1] + " " + b[0].toFixed(1) + "," + b[1].toFixed(1) + " ";

      }

      var S0 = 1.6;
      var MID = { x: (760 + 1230) / 2, y: (500 + 330) / 2 };         // mid-course between waypoint 2 and 3
      var P3 = { x: 1230, y: 330 }, PA = { x: 1590, y: 200 };

      /* ---- first image = handoff_in : travelling mid-course, motion blur 8 px ---- */
      gsap.set(gcam, camAt(S0, MID.x, MID.y));
      gsap.set(glens, { filter: "blur(8px)" });

      /* ---- Scene 1 : the dive into the 3rd point, the real page ---- */
      // 0.00 → 0.25 arrival on the 3rd point (expo.out), the blur clears
      ft(gcam, camAt(S0, MID.x, MID.y), Object.assign(camAt(S0, P3.x, P3.y), { duration: 0.25, ease: "expo.out" }), 0);
      ft(glens, { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.25, ease: "expo.out" }, 0);
      // 0.25 → 0.47 plunge through the ring (power3.in), the ring grows to frame the page
      ft(gcam, camAt(S0, P3.x, P3.y), Object.assign(camAt(30, P3.x, P3.y), { duration: 0.22, ease: "power3.in" }), 0.25);
      ft(glens, { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.22, ease: "power3.in" }, 0.25);
      ft(glens, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power1.in" }, 0.41);
      // 0.38 → 0.70 landing on the page « Ton point d'équilibre » (×3 blur 10 → sharp, expo.out)
      ft(plens, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, 0.38);
      ft(pcam, { scale: 3, x: 0 }, { scale: 1, duration: 0.32, ease: "expo.out" }, 0.38);
      ft(plens, { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, 0.38);
      // drift z +1 %/s on the line, then the slower drift 1.20 → 1.75
      ft(pcam, { scale: 1 }, { scale: 1.0065, duration: 0.65, ease: "none" }, 0.70);
      ft(pcam, { scale: 1.0065, x: 0 }, { scale: 1.012, x: -10, duration: 0.40, ease: "power1.inOut" }, 1.35);
      // 0.92 the accent ring traces around « Ventes nécessaires … 2 » (0.3 s)
      ft(ring, { strokeDashoffset: RL }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.92);
      // foreground : the blurred green « 84 400 € » tag crosses the bottom left
      ft($("tag"), { x: -760, opacity: 0 }, { x: -470, opacity: 0.8, duration: 0.3, ease: "power2.out" }, 0.62);
      ft($("tag"), { x: -470 }, { x: -60, duration: 1.13, ease: "none" }, 0.92);

      /* ---- Scene 2 : less breakage, less lost time ---- */
      // 1.75 → 2.00 the page goes away (camera pulls back, expo.out), the dials enter from the bottom
      ft(pcam, { scale: 1.012, x: -10, y: 0 }, { scale: 0.62, x: -10, y: -120, duration: 0.3, ease: "expo.out" }, 1.75);
      ft(plens, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.out" }, 1.75);
      ft($("tag"), { opacity: 0.8 }, { opacity: 0, duration: 0.16, ease: "power1.out" }, 1.75);
      ft(dash, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 1.76);
      ft(dcam, { y: 420, scale: 0.92 }, { y: 0, scale: 1, duration: 0.3, ease: "expo.out" }, 1.76);
      // camera drift x +15 px/s on the dials
      ft(dcam, { x: 0 }, { x: -27, duration: 1.84, ease: "none" }, 1.76);
      // foreground dial slides in quicker (parallax)
      ft($("fgdial"), { y: 560 }, { y: 0, duration: 0.34, ease: "expo.out" }, 1.76);
      // 2.05 the needle leaves the reserve and rises to the middle (0.4 s power3.out), the level arc follows
      var needle = $("needle");
      gsap.set(needle, { rotation: RES, svgOrigin: GX + " " + GY });
      ft(needle, { rotation: RES }, { rotation: 0, svgOrigin: GX + " " + GY, duration: 0.4, ease: "power3.out" }, 2.05);
      ft($("nl"), { stroke: "#ff3b2f" }, { stroke: "#ffffff", duration: 0.25, ease: "power1.out" }, 2.08);
      ft(level, { strokeDashoffset: LV_RES }, { strokeDashoffset: 0, duration: 0.4, ease: "power3.out" }, 2.05);
      // the € warning light goes out
      ft($("eur"), { opacity: 1 }, { opacity: 0.16, duration: 0.2, ease: "power2.out" }, 2.22);
      ft($("eurglow"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.22);
      // 2.81 the « 03 » drum rolls backwards to « 00 » (0.3 s) with a counting scale settle
      var DG = 286;
      gsap.set($("strip2"), { y: -3 * DG });
      ft($("strip2"), { y: -3 * DG }, { y: 0, duration: 0.3, ease: "power3.out" }, 2.81);
      ft($("strip2"), { filter: "blur(0px)" }, { filter: "blur(3px)", duration: 0.08, ease: "power1.in" }, 2.81);
      ft($("strip2"), { filter: "blur(3px)" }, { filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 2.93);
      ft($("drums"), { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 2.81);
      // 3.40 → 3.60 hold (drift continues)
      // 3.60 → 4.05 the camera pulls back : the GPS screen takes the frame again, then the push to the arrival point
      ft(dcam, { scale: 1 }, { scale: 0.7, duration: 0.2, ease: "expo.out" }, 3.60);
      ft(dash, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.out" }, 3.60);
      ft(glens, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, 3.62);
      ft(gcam, camAt(1.14, 960, 540), Object.assign(camAt(1, 960, 540), { duration: 0.12, ease: "expo.out" }), 3.62);
      // 3.74 → 4.05 push power3.in toward the arrival point : at 4.05 the 44 px disc is centred, ~30 % of the frame width, blur 6 px
      var SE = (0.3 * 1920) / 44;
      ft(gcam, camAt(1, 960, 540), Object.assign(camAt(SE, PA.x, PA.y), { duration: 0.31, ease: "power3.in" }), 3.74);
      ft(glens, { filter: "blur(0px)" }, { filter: "blur(6px)", duration: 0.31, ease: "power3.in" }, 3.74);

      /* ---- the voice line : word by word, 35 % white then white ; one key-word box per sentence ---- */
      Array.prototype.forEach.call(root.querySelectorAll(".f11-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f11-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
      });
      ft($("kb1"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 0.90 - FR);
      ft($("kb2"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.86 - FR);
      ft($("kb3"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.10 - FR);
      // peak stroke [trait : moins de casse] 1.88 → 2.23
      ft($("peak"), { scaleX: 0, rotation: -1.2 }, { scaleX: 1, rotation: -1.2, duration: 0.35, ease: "power2.out" }, 1.88);
      // the bottom shade comes with the first word, each sentence leaves before the next one (and before the seam)
      ft($("shade"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.08);
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.66);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.60);
      ft($("s3"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.56);
      ft($("shade"), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.out" }, 3.56);

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
