    (function () {

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- sheet geometry (sheet-local px) ---- */
      var SH = { cx: 960, cy: 540, w: 760, h: 980, rot: -4 * Math.PI / 180 };
      // measured ink widths (Caveat 600 64 px) of the three questions, "?" included

        { id: "q1", x: 70, base: 739, ink: 244, full: 280 },

        { id: "q3", x: 70, base: 949, ink: 486, full: 522 }

      // sheet-local point -> layer point (sheet rotated around its centre)
      function P(lx, ly) {
        var dx = lx - SH.w / 2, dy = ly - SH.h / 2, c = Math.cos(SH.rot), s = Math.sin(SH.rot);

      function ringPt(u) {
        var a = Math.PI * 1.08 + u * Math.PI * 2.18, r = 1 + 0.06 * u;
        var ex = Math.cos(a) * RC.rx * r, ey = Math.sin(a) * RC.ry * r;
        return { x: RC.x + ex * Math.cos(RC.tilt) - ey * Math.sin(RC.tilt), y: RC.y + ex * Math.sin(RC.tilt) + ey * Math.cos(RC.tilt) };
      }
      var rd = "";
      for (var k = 0; k <= 72; k++) { var rp = ringPt(k / 72); rd += (k ? " L " : "M ") + rp.x.toFixed(1) + " " + rp.y.toFixed(1); }

      ft($("g1"), { "--dof": "0px", opacity: 1 }, { "--dof": "1.5px", opacity: 0.8, duration: 0.35, ease: "power2.inOut" }, 2.15);
      ft($("g2"), { "--dof": "0px", opacity: 1 }, { "--dof": "1.5px", opacity: 0.8, duration: 0.35, ease: "power2.inOut" }, 3.25);

      var penAt = { x: 1900, y: 260 };   // where 04 left it, out of frame
      gsap.set(pen, { x: penAt.x, y: penAt.y });
      function penTo(x, y, dur, ease, pos) {
        ft(pen, { x: penAt.x, y: penAt.y }, { x: x, y: y, duration: dur, ease: ease }, pos);

        // the red "?" lands on its word (2 frames early), the pen dots it
        penTo(q.x + q.full - 8, y - 6, tMark - (tStart + tInk), "power2.inOut", tStart + tInk);
        ft(m, { clipPath: CLIP0 }, { clipPath: CLIP1, duration: 0.08, ease: "none" }, tMark);
      }
      // 0.12 the blurred pen comes back in from the right, onto the start of question 1
      tl.set(pen, { opacity: 1 }, 0.12);
      penTo(Q[0].x, Q[0].base - 12, 0.18, "power3.out", 0.12);
      // 0.30 "Quel modèle" (0.4 s), "?" at 0.80 - 2 frames
      write(Q[0], 0.30, 0.40, 0.80 - 2 * FR);

      // 1.40 four model words scribbled around, then struck through in red at 1.90
      var MW = [
        { id: "mw1", t: 1.40, x0: 440, x1: 670, y: 694 },
        { id: "mw2", t: 1.52, x0: 478, x1: 676, y: 750 },
        { id: "mw3", t: 1.64, x0: 96, x1: 240, y: 806 },
        { id: "mw4", t: 1.76, x0: 300, x1: 536, y: 810 }
      ];
      MW.forEach(function (w, i) {
        var el = $(w.id);
        tl.set(el, { opacity: 1 }, w.t);
        ft(el.firstElementChild, { clipPath: CLIP0 }, { clipPath: CLIP1, duration: 0.1, ease: "none" }, w.t);
        penTo(w.x0, w.y, i === 0 ? 0.1 : 0.02, "power2.out", w.t - (i === 0 ? 0.1 : 0.02));
        penTo(w.x1, w.y, 0.1, "none", w.t);
      });
      // strikes : svg-path-draw (measured straight lengths), one red stroke through each word
      ["k1", "k2", "k3", "k4"].forEach(function (k, i) {
        var p = $(k), d = p.getAttribute("d").match(/-?\d+(\.\d+)?/g).map(Number);
        var len = Math.hypot(d[2] - d[0], d[3] - d[1]) * 1.05, t = 1.90 + i * 0.06;
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
        tl.set(p, { opacity: 1 }, t);
        ft(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.1, ease: "power2.out" }, t);
      });
      penTo(MW[3].x1 - 40, 804, 0.24, "power2.inOut", 1.86);

      // 2.29 "Combien il me faut", "?" at 2.88 ; 3.38 "Combien je dois vendre", "?" at 3.95
      penTo(Q[1].x, Q[1].base - 12, 0.22, "power3.out", 2.07);
      write(Q[1], 2.29, 0.50, 2.88 - 2 * FR);
      penTo(Q[2].x, Q[2].base - 12, 0.22, "power3.out", 3.13);
      write(Q[2], 3.38, 0.48, 3.95 - 2 * FR);
      // the pen leaves by the right before the light goes out
      ft(pen, { x: penAt.x, y: penAt.y }, { x: penAt.x + 760, y: penAt.y - 260, duration: 0.2, ease: "power3.in" }, 4.03);
      tl.set(pen, { opacity: 0 }, 4.24);

      // 4.10 the three red "?" pulse once (x1.1, 0.12 s)
      ["q1m", "q2m", "q3m"].forEach(function (id) {
        ft($(id), { scale: 1 }, { scale: 1.1, duration: 0.05, ease: "power3.out" }, 4.10);
        ft($(id), { scale: 1.1 }, { scale: 1, duration: 0.07, ease: "power2.in" }, 4.15);
      });

      /* ---- scene 2 : the light switches off ---- */
      // measured on screen at 4.30 : glyph (ink box) centres of the three red "?" of the sheet, and their rendered font size
      var MK_FONT0 = 76.5, GX = 0, GY = 0;
      var MK = [
        { start: { x: 0, y: 0 }, end: { x: 880, y: 520 } },
        { start: { x: 0, y: 0 }, end: { x: 960, y: 500 } },
        { start: { x: 0, y: 0 }, end: { x: 1040, y: 520 } }
      ];
      // ink centre of the 72 px Caveat "?" inside its 100 x 100 box (measured), so the wrapper origin is the glyph centre
      Array.prototype.forEach.call(root.querySelectorAll(".f05-cmg"), function (g) { g.style.setProperty("--gx", (-50 + GX) + "px"); g.style.setProperty("--gy", (-50 + GY) + "px"); });
      // 4.30 the lamp switches off : sheet, writing, calculations and halo to black in 0.12 s (power2.in)
      ft($("black"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in" }, 4.30);
      // the three red "?" stay lit : screen copies swapped in at 4.30 exactly over the sheet's own (measured glyph centres,
      // on-screen size 64 x 1.15 x drift = MK_S0 x 72 px, sheet rotation -4), glowing red
      // 4.42 -> 4.90 they detach and travel to the handoff (power2.inOut), size to 72 px, rotation to 0 ;
      // an inner linear drift toward (960,520) at 60 px/s keeps them moving through the seam
      var MK_S0 = MK_FONT0 / 72, V = 60, TD = DUR - 4.42;
      MK.forEach(function (m, i) {
        var el = $("c" + (i + 1)), inner = el.firstElementChild;
        var dx = 960 - m.end.x, dy = 520 - m.end.y, dl = Math.hypot(dx, dy), ux = dx / dl, uy = dy / dl;
        var D = V * TD;   // drift distance covered by 4.90
        gsap.set(el, { x: m.start.x, y: m.start.y, rotation: -4, scale: MK_S0 });
        tl.set(el, { opacity: 1 }, 4.30);
        ft(el, { x: m.start.x, y: m.start.y, rotation: -4, scale: MK_S0 },
          { x: m.end.x - ux * D, y: m.end.y - uy * D, rotation: 0, scale: 1, duration: TD, ease: "power2.inOut" }, 4.42);
        ft(inner, { x: 0, y: 0 }, { x: ux * D, y: uy * D, duration: TD, ease: "none" }, 4.42);
      });

      /* ---- the voice line : word by word, 35 % white then white ; one key-word box per sentence ---- */
      Array.prototype.forEach.call(root.querySelectorAll(".f05-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f05-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
      });
      ft($("kb1"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 0.78 - FR);
      ft($("kb2a"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.57 - FR);
      ft($("kb2b"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.71 - FR);
      ft($("kb2c"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.86 - FR);
      ft($("kb3"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.93 - FR);
      // each sentence leaves before the next one ; the last leaves at 4.25
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.08);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.18);
      ft($("s3"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.25);
      // the bottom shade comes with the first word and leaves with the last
      ft($("shade"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, 0.08);
      ft($("shade"), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.out" }, 4.25);

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
