      ft($("plan"), { x: 0, y: 0 }, { x: 46, y: -14, duration: DUR, ease: "none" }, 0);
      ft($("arcs"), { x: 0 }, { x: -70, duration: DUR, ease: "none" }, 0);

      /* ---- scene 1 : the disc stretches into a pill and becomes the search bar of the hook ---- */
      var G = 120 / 44, H = (1460 / G - 44) / 2;          // group scale, half length between cap centres
      ft($("mo"), { scale: 1 }, { scale: G, duration: 0.35, ease: "power3.out" }, FR);
      ft($("mL"), { x: 0 }, { x: -H, duration: 0.35, ease: "power3.out" }, FR);
      ft($("mR"), { x: 0 }, { x: H, duration: 0.35, ease: "power3.out" }, FR);
      ft($("mM"), { scaleX: 0 }, { scaleX: (2 * H) / 44, duration: 0.35, ease: "power3.out" }, FR);
      ft([$("mL"), $("mR"), $("mM")], { backgroundColor: "#FC7E15" }, { backgroundColor: "#ffffff", duration: 0.18, ease: "power1.inOut" }, 0.14);
      ft($("mL"), { boxShadow: "0 0 26px rgba(252,126,21,0.7)" }, { boxShadow: "0 0 26px rgba(252,126,21,0)", duration: 0.18, ease: "power1.inOut" }, 0.14);
      ft($("barwrap"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, 0.24);
      ft($("mo"), { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "power1.in" }, 0.34);

      // 0.85 -> 1.45 the query erases char by char (0.04 s per char), accent caret riding back
      for (var k = chars.length - 1, e = 0; k >= 0; k--, e++) {
        var te = 0.85 + 0.04 * e;
        tl.set(chars[k], { opacity: 0 }, te);
        tl.set(carets[k + 1], { opacity: 0 }, te);
        tl.set(carets[k], { opacity: 1 }, te);
      }
      // 1.60 -> 2.10 empty field, the caret blinks (2 steps)
      tl.set(carets[0], { opacity: 0 }, 1.68);
      tl.set(carets[0], { opacity: 1 }, 1.92);

      /* ---- scene 2 : the bar fills with accent and becomes the button ---- */
      var MS = 2.26, BX = 1120 / 1460, BY = 160 / 120;
      ft($("fill"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, MS);
      ft($("barwrap"), { scaleX: 1, scaleY: 1 }, { scaleX: BX, scaleY: BY, duration: 0.3, ease: "expo.out" }, MS);
      ft($("cta"), { scaleX: 1 / BX, scaleY: 1 / BY }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "expo.out" }, MS);
      ft($("cta"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, MS + 0.08);
      ft($("barwrap"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.in" }, MS + 0.2);
      // 2.60 the label arrives (x1.1, blur 4 -> sharp)
      ft($("lbl"), { opacity: 0, scale: 1.1, filter: "blur(4px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 2.60);
      // 3.06 the micro types above
      micro.forEach(function (c, j) { tl.set(c, { opacity: 1 }, 3.06 + 0.025 * j); });
      // 3.40 the line arrives
      ft($("line"), { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 3.40);
      // 3.70 the URL types
      url.forEach(function (c, j) { tl.set(c, { opacity: 1 }, 3.70 + 0.02 * j); });

      /* ---- scene 3 : the cursor of the hook comes back and clicks directly ---- */
      var CLICK = { x: 960 + 230, y: 470 + 22 };          // a little right of and below the button centre (human aim)
      var TIP = { x: 9.5, y: 6.3 };
      var cur = $("cur");
      gsap.set(cur, { x: 2150, y: 1250, transformOrigin: TIP.x + "px " + TIP.y + "px" });
      tl.set(cur, { opacity: 1 }, 4.40);
      ft(cur, { x: 2150 }, { x: CLICK.x - TIP.x, duration: 0.45, ease: "power3.out" }, 4.40);
      ft(cur, { y: 1250 }, { y: CLICK.y - TIP.y, duration: 0.45, ease: "power2.out" }, 4.40);
      // 4.85 click : press x0.85 (0.06 s), button dip, pressed state accent -> accent-deep -> accent, accent ripple
      ft(cur, { scale: 1 }, { scale: 0.85, duration: 0.06, ease: "power2.in" }, 4.85);
      ft(cur, { scale: 0.85 }, { scale: 1, duration: 0.06, ease: "power2.out" }, 4.91);
      ft($("cta"), { scale: 1 }, { scale: 0.95, duration: 0.06, ease: "power1.in" }, 4.85);
      ft($("cta"), { scale: 0.95 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 4.91);
      ft($("cta"), { backgroundColor: "#FC7E15" }, { backgroundColor: "#e0620a", duration: 0.06, ease: "power1.in" }, 4.85);
      ft($("cta"), { backgroundColor: "#e0620a" }, { backgroundColor: "#FC7E15", duration: 0.35, ease: "power2.out" }, 4.91);
      tl.set([$("ring1"), $("ring2")], { opacity: 1 }, 4.85);
      ft($("ring1"), { scale: 0.3, opacity: 1 }, { scale: 4.2, opacity: 0, duration: 0.7, ease: "power2.out" }, 4.85);
      ft($("ring2"), { scale: 0.3, opacity: 1 }, { scale: 4.2, opacity: 0, duration: 0.7, ease: "power2.out" }, 4.93);
      // 5.00 -> 7.40 living hold : the glow of the button crosses it once, edge to edge
      ft($("sheen"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 5.10);
      ft($("sheen"), { x: -380 }, { x: 1140, duration: 2.1, ease: "power1.inOut" }, 5.10);

      /* ---- the voice line : word by word, 35 % white then white ; one key-word box per sentence ---- */
      Array.prototype.forEach.call(root.querySelectorAll(".f12-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f12-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
      });
      ft($("kb1"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.38 - FR);
      ft($("kb2"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.31 - FR);
      // each sentence leaves before the next one ; the second leaves at 4.20
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.06);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.20);

      /* ---- 7.40 -> 7.95 wanted fade to black ---- */
      ft($("black"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.inOut" }, 7.40);

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
