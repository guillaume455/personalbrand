  <div id="root" data-composition-id="08-preuve" data-width="1920" data-height="1080" data-duration="5.6">

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "08-preuve", DUR = 5.6, FR = 1 / 30;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#f08-" + id); }

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- typed lines : one span per char ---- */
      function buildLine(el, lab, val) {
        var spans = [];
        [[lab, "f08-lab"], [val, ""]].forEach(function (part) {
          for (var i = 0; i < part[0].length; i++) {
            var s = document.createElement("span");
            s.className = "f08-ch" + (part[1] ? " " + part[1] : "");
            s.textContent = part[0].charAt(i);
            el.appendChild(s); spans.push(s);
          }
        });
        return spans;
      }
      var L1 = buildLine($("l1"), "FORMATION : ", "AUCUNE");
      var L2 = buildLine($("l2"), "EXPÉRIENCE : ", "AUCUNE");

      /* ---- seek-safe derived values (counters + streak), computed from the timeline time ---- */
      var E3 = gsap.parseEase("power3.out"), EX = gsap.parseEase("expo.in");
      var v1 = $("v1"), v2 = $("v2"), blurNode = $("streak-blur");
      var WHIP_AT = 5.30, WHIP_END = DUR - FR, WHIP_D = WHIP_END - WHIP_AT;   // the last image already holds handoff_out
      function clamp(p) { return p < 0 ? 0 : (p > 1 ? 1 : p); }
      function fmt(n) { var s = String(n); return s.length > 3 ? s.slice(0, s.length - 3) + " " + s.slice(-3) : s; }
      var last1 = "", last2 = "", lastB = "";
      function derive() {
        var t = tl.time();
        var a = Math.round(21 * E3(clamp((t - 1.00) / 0.25)));
        var t1 = (a < 10 ? "0" : "") + a;
        var b = Math.round(3000 * E3(clamp((t - 2.05) / 0.35)));
        var t2 = fmt(b);
        var bl = (14 * EX(clamp((t - WHIP_AT) / WHIP_D))).toFixed(2) + " 0";
        if (t1 !== last1) { v1.textContent = t1; last1 = t1; }
        if (t2 !== last2) { v2.textContent = t2; last2 = t2; }
        if (bl !== lastB) { blurNode.setAttribute("stdDeviation", bl); lastB = bl; }
      }
      tl.eventCallback("onUpdate", derive);

      /* ---- camera track : drift x +20 px/s (world slides left), z +1 %/s ; whip at 5.30 ---- */
      ft($("cam"), { x: 0, scale: 1 }, { x: -20 * DUR, scale: 1 + 0.01 * DUR, duration: DUR, ease: "none" }, 0);
      // whip : portrait, numbers, name, lines leave by the left (expo.in, streak 0 -> 14 px)
      ft($("whip"), { x: 0 }, { x: -1900, duration: WHIP_D, ease: "expo.in" }, WHIP_AT);
      // foreground particles : faster parallax, fade in after the seam, whip harder
      ft($("fgw"), { x: 0 }, { x: -45 * WHIP_AT, duration: WHIP_AT, ease: "none" }, 0);
      ft($("fgw"), { x: -45 * WHIP_AT }, { x: -45 * WHIP_AT - 2600, duration: WHIP_D, ease: "expo.in" }, WHIP_AT);
      [["p2", .45], ["p3", .30]].forEach(function (p, i) {
        ft($(p[0]), { opacity: 0 }, { opacity: p[1], duration: 0.6, ease: "power2.out" }, 0.30 + 0.1 * i);
      });

      /* ---- scene 1 : the numbers of the start ---- */
      // 0.15 the bottom shade comes in (the subtitle band)
      ft($("shade"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.15);
      // 0.30 the name slides down 600 -> 640 to make room
      ft($("name"), { y: 0 }, { y: 40, duration: 0.3, ease: "power3.out" }, 0.30);
      // 0.40 the 2010 watermark appears behind (6 %), far plane drifts slower (8 px/s)
      var WM = { x0: 130, y0: -110, s0: 1.25 };
      ft($("wm"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.40);
      ft($("wm"), { x: WM.x0, y: WM.y0, scale: WM.s0 * 1.04 }, { x: WM.x0 - 8 * (WHIP_AT - 0.4), y: WM.y0, scale: WM.s0, duration: WHIP_AT - 0.4, ease: "none" }, 0.40);
      gsap.set($("wm"), { x: WM.x0, y: WM.y0, scale: WM.s0 * 1.04, transformOrigin: "500px 110px" });
      // 1.00 « 21 ANS » rolls 00 -> 21, arrives too big x1.3, blur 6 -> sharp (0.25 s)
      tl.set($("n1"), { opacity: 1 }, 1.00);
      ft($("n1"), { scale: 1.3, filter: "blur(6px)" }, { scale: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, 1.00);
      // 2.05 « 3 000 € » rolls 0 -> 3 000 (0.35 s), rises from below out of soft focus
      tl.set($("n2"), { opacity: 1 }, 2.05);
      ft($("n2"), { y: 46, scale: 1.12, filter: "blur(6px)" }, { y: 0, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 2.05);

      /* ---- scene 2 : no training, no experience ---- */
      function typeLine(spans, at) {
        var step = 0.25 / spans.length;
        spans.forEach(function (s, k) { tl.set(s, { opacity: 1 }, at + step * k); });
      }
      ft($("l1"), { x: -14 }, { x: 0, duration: 0.3, ease: "power3.out" }, 3.52 - FR);
      typeLine(L1, 3.52 - FR);
      ft($("l2"), { x: -14 }, { x: 0, duration: 0.3, ease: "power3.out" }, 4.58 - FR);
      typeLine(L2, 4.58 - FR);
      // 5.30 -> end : the watermark catches the light (white 100 %) and runs to the centre (960, 470)
      var wx = WM.x0 - 8 * (WHIP_AT - 0.4);
      ft($("wm"), { x: wx, y: WM.y0, scale: WM.s0 }, { x: 0, y: 0, scale: 1, duration: WHIP_D, ease: "expo.in" }, WHIP_AT);
      ft($("yr-l"), { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.in" }, WHIP_AT);
      ft($("yr-w"), { opacity: 0.06 }, { opacity: 0, duration: 0.18, ease: "power2.in" }, WHIP_AT);

      /* ---- the voice line : word by word, 35 % white then white ; one key-word box per sentence ---- */
      Array.prototype.forEach.call(root.querySelectorAll(".f08-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f08-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
      });
      ft($("kb2"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.10 - FR);
      ft($("kb3"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.79 - FR);
      ft($("kb4"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 4.71 - FR);
      // each sentence leaves before the next one (and before the seam : no subtitle at 5.60)
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.66);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.32);
      ft($("s3"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.40);
      ft($("s4"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 5.30);
      ft($("shade"), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power1.out" }, 5.30);

      // exact frame length
      tl.set({}, {}, DUR);
      derive();

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
