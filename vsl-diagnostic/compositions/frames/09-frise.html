  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "09-frise", DUR = 4.75, FR = 1 / 30;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#f09-" + id); }
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

      /* ---------- the timeline of years (world units ; the camera holds it at x2) ---------- */
      var Y0 = -698, STEP = 111, SCALE1 = 2;          // 2010 at world x -698 ; one label every 2 years
      var years = [], ticks = $("ticks"), yBox = $("years"), SVGNS = "http://www.w3.org/2000/svg";
      for (var k = 0; k <= 8; k++) {
        var X = Y0 + STEP * k;
        var d = document.createElement("div");
        d.className = "f09-yr"; d.textContent = String(2010 + 2 * k); d.style.left = (X - 100) + "px";
        d.style.filter = "url(#f09-streak)";
        yBox.appendChild(d); years.push({ el: d, x: X });
        var c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("cx", X); c.setAttribute("cy", 700); c.setAttribute("r", 5); ticks.appendChild(c);
      }
      // hand-written errors : one span per character
      var errChars = {};
      ["e1", "e2", "e3"].forEach(function (id) {
        var tx = $(id).querySelector(".f09-tx"), s = tx.textContent; tx.textContent = ""; errChars[id] = [];
        for (var i = 0; i < s.length; i++) { var sp = document.createElement("span"); sp.className = "f09-ch"; sp.textContent = s.charAt(i); tx.appendChild(sp); errChars[id].push(sp); }
      });
      var fgItems = Array.prototype.map.call(root.querySelectorAll(".f09-fgy"), function (el) {
        el.style.filter = "blur(9px)"; return { el: el, x: parseFloat(el.getAttribute("data-x")) };
      });

      /* ---------- camera : one pure function of time ---------- */
      // scene 1 travel (screen px) : the whip ends 3000 → 450 px/s over 0.25 s, then a travelling that
      // swells to ~900 px/s and decelerates to a smooth stop on 2026 at 2.70 (total 1776 px = 8 labels).
      var DA = 450 * 0.25 + 2550 * 0.25 / 4, DTOT = 8 * STEP * SCALE1;
      var AK = ((DTOT - DA) / 2.45 - 450 * (9 / 14)) / 0.225;
      function travel(t) {
        if (t <= 0) return 0;
        if (t <= 0.25) { var q = 1 - 4 * t; return 450 * t + 2550 * 0.25 / 4 * (1 - q * q * q * q); }
        var u = Math.min(1, (t - 0.25) / 2.45);
        return DA + 2.45 * (450 * (u - Math.pow(u, 4) / 2 + Math.pow(u, 7) / 7) + AK * (u * u / 2 - 2 * Math.pow(u, 5) / 5 + Math.pow(u, 8) / 8));
      }
      var E_p2o = gsap.parseEase("power2.out"), E_p2io = gsap.parseEase("power2.inOut"), E_p3io = gsap.parseEase("power3.inOut");
      var CX1 = Y0 + DTOT / SCALE1;                       // 190 : 2026 centred at 2.70
      var SREC = 1.86;                                    // light pull back 2.70 → 3.20
      var S_L = 0.994, CX_L = 330 + 630 / S_L, CY_L = 700 - 160 / S_L;   // landing pose, start point fixed on screen
      function camAt(t) {
        if (t <= 2.70) return { s: SCALE1, cx: Y0 + travel(t) / SCALE1, cy: 690 };
        if (t <= 3.20) { var e = E_p2o((t - 2.70) / 0.5); return { s: SCALE1 + (SREC - SCALE1) * e, cx: CX1, cy: 690 }; }
        if (t <= 4.45) {
          var u = (t - 3.20) / 1.25, ep = E_p2io(u), es = E_p3io(u);
          return { s: SREC + (S_L - SREC) * es, cx: CX1 + (CX_L - CX1) * ep, cy: 690 + (CY_L - 690) * ep };
        }
        var v = clamp01((t - 4.45) / 0.30);   // slow push toward the start point, +2 %/s
        return { s: S_L + (1 - S_L) * v, cx: CX_L + (960 - CX_L) * v, cy: CY_L + (540 - CY_L) * v };
      }

      var world = $("world"), blurNode = $("streak-blur"), count = $("count");
      var streaked = years.map(function (y) { return y.el; });
      var lastBlurOn = null;
      function render(t) {
        var c = camAt(t);
        gsap.set(world, { x: 960 - c.s * c.cx, y: 540 - c.s * c.cy, scale: c.s, transformOrigin: "0px 0px" });
        // directional whip blur : 14 px → 0 with the whip's velocity (stdDeviation in world units = /2)
        var b = t < 0.25 ? 14 * Math.pow(1 - 4 * t, 3) : 0;
        blurNode.setAttribute("stdDeviation", (b / SCALE1).toFixed(3) + " 0");
        var on = b > 0.05;
        if (on !== lastBlurOn) { streaked.forEach(function (el) { el.style.filter = on ? "url(#f09-streak)" : "none"; }); lastBlurOn = on; }
        // the year nearest the centre is white, the others ink-mute
        years.forEach(function (y) {
          var sx = 960 + c.s * (y.x - c.cx), w = clamp01(1 - Math.abs(sx - 960) / 230);
          var r = Math.round(138 + (255 - 138) * w), g = Math.round(143 + (255 - 143) * w), bl = Math.round(152 + (255 - 152) * w);
          y.el.style.color = "rgb(" + r + "," + g + "," + bl + ")";
        });
        // foreground years slide 1.6x faster (parallax), stop with the camera
        var tr = travel(Math.min(t, 2.70));
        fgItems.forEach(function (f) { gsap.set(f.el, { x: f.x - 1.6 * tr }); });
      }

      /* ---------- the one paused timeline ---------- */
      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      var clock = { t: 0 };
      render(0);
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

      /* ---- scene 1 : the errors written then struck ---- */
      function writeErr(id, t0, t1) {
        var ch = errChars[id], n = ch.length, dt = (t1 - t0) / n;
        ch.forEach(function (sp, i) {
          ft(sp, { opacity: 0, y: 3, filter: "blur(2px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: Math.max(0.06, dt * 2.2), ease: "power2.out" }, t0 + i * dt);
        });
      }
      function strike(k, t) {
        ft($(k), { scaleX: 0, rotation: -1.2 }, { scaleX: 1, rotation: -1.2, duration: 0.15, ease: "power2.out" }, t);
      }
      writeErr("e1", 0.30, 0.80); strike("k1", 0.98);
      writeErr("e2", 1.05, 1.25); strike("k2", 1.30);
      writeErr("e3", 1.55, 1.75); strike("k3", 1.80);
      // struck errors settle back into the soft ink
      ft($("e1"), { opacity: 1 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 1.13);
      ft($("e2"), { opacity: 1 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 1.45);
      ft($("e3"), { opacity: 1 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 1.95);

      // 1.65 → 2.10 the year counter above the timeline rolls 2010 → 2026
      ft(count, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out" }, 1.65);
      var roll = { v: 2010 };
      function writeCount() { count.textContent = String(Math.round(roll.v)); }
      writeCount();
      ft(roll, { v: 2010 }, { v: 2026, duration: 0.42, ease: "power2.inOut", onUpdate: writeCount }, 1.68);

      /* ---- scene 2 : toi, then the route ---- */
      // 2.70 the « toi » point lands after 2026 (x1.4 → 1, 0.14 s)
      ft($("toi"), { opacity: 0, scale: 1.4, svgOrigin: "330 700" }, { opacity: 1, scale: 1, svgOrigin: "330 700", duration: 0.14, ease: "power3.out" }, 2.70);
      // the foreground years leave with the stop of the travelling
      ft($("fgset"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.out" }, 2.75);
      // 3.26 → 4.40 the route draws from the point (svg-path-draw)
      var route = $("route"), glow = $("glow"), LEN = route.getTotalLength();
      [route, glow].forEach(function (p) { p.style.strokeDasharray = LEN + " " + (LEN + 40); p.style.strokeDashoffset = LEN; });
      var DRAW0 = 3.26, DRAWD = 1.14, DRAW_EASE = "sine.inOut";
      tl.set([route, glow], { opacity: 1 }, DRAW0);
      ft([route, glow], { strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: DRAWD, ease: DRAW_EASE }, DRAW0);
      // waypoints light when the tip passes them (measured on the path, eased time inverted)
      var E_draw = gsap.parseEase(DRAW_EASE);
      function lenNear(px, py) { var best = 0, bd = 1e9; for (var l = 0; l <= LEN; l += 2) { var p = route.getPointAtLength(l), dd = (p.x - px) * (p.x - px) + (p.y - py) * (p.y - py); if (dd < bd) { bd = dd; best = l; } } return best; }
      function timeAtFrac(f) { var lo = 0, hi = 1; for (var i = 0; i < 40; i++) { var m = (lo + hi) / 2; if (E_draw(m) < f) lo = m; else hi = m; } return DRAW0 + DRAWD * lo; }
