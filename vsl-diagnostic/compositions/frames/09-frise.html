  <script>
    (function () {
      var FID = "09-frise", DUR = 4.75, FR = 1 / 30;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#f09-" + id); }
      function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

      /* ---------- the timeline of years (world units ; line y 700, labels 90 px, one every 2 years) ---------- */
      var STEP = 200, X2026 = 130, Y0 = X2026 - 8 * STEP;      // 2010 at world x -1470 ; « toi » point at (330, 700)
      var LBL_Y = 635, CY1 = 663.7;                            // label centre ; camera y of scene 1 (2010 at screen y 470)
      var years = [], ticks = $("ticks"), yBox = $("years"), SVGNS = "http://www.w3.org/2000/svg";
      for (var k = 0; k <= 8; k++) {
        var X = Y0 + STEP * k;
        var d = document.createElement("div");
        d.className = "f09-yr"; d.textContent = String(2010 + 2 * k); d.style.left = (X - 150) + "px";
        yBox.appendChild(d); years.push({ el: d, x: X });
        var c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("cx", X); c.setAttribute("cy", 700); c.setAttribute("r", 4.5); ticks.appendChild(c);
      }
      // hand-written errors : one span per character
      var errChars = {};
      ["e1", "e2", "e3"].forEach(function (id) {
        var tx = $(id).querySelector(".f09-tx"), s = tx.textContent; tx.textContent = ""; errChars[id] = [];
        for (var i = 0; i < s.length; i++) { var sp = document.createElement("span"); sp.className = "f09-ch"; sp.textContent = s.charAt(i); tx.appendChild(sp); errChars[id].push(sp); }
      });
      var fgItems = Array.prototype.map.call(root.querySelectorAll(".f09-fgy"), function (el) {
        return { el: el, x: parseFloat(el.getAttribute("data-x")) };
      });

      /* ---------- camera : one pure function of time ---------- */
      // scene 1 (world px/s) : the whip of frame 08 lands (2400 px/s on screen → 560 px/s by 0.25, slight pull back
      // x2.44 → x2), a calm travelling over the errors, then from 1.88 the sixteen years rush by (peak ~2.2)
      // and the camera slows down to a stop on 2026 at 2.70, pulling back to x1.4.
      var S0 = 2.44, S1 = 2.0, S2 = 1.4, CXE = X2026, W = CXE - Y0;
      var V0 = 2400 / S0, VB = 290, T1 = 1.88, L = 2.70 - T1;
      var DA = VB * 0.25 + (V0 - VB) * 0.25 / 4, DB = VB * (T1 - 0.25), KR = 60 * ((W - DA - DB) / L - VB * 0.5);
      function travel(t) {
        if (t <= 0) return 0;
        if (t <= 0.25) { var q = 1 - 4 * t; return VB * t + (V0 - VB) * 0.25 / 4 * (1 - q * q * q * q); }
        if (t <= T1) return DA + VB * (t - 0.25);
        var u = Math.min(1, (t - T1) / L);
        return DA + DB + L * (VB * (u - u * u * u + u * u * u * u / 2) + KR * (u * u * u / 3 - 3 * Math.pow(u, 4) / 4 + 3 * Math.pow(u, 5) / 5 - Math.pow(u, 6) / 6));
      }
      var E_p2o = gsap.parseEase("power2.out"), E_p2io = gsap.parseEase("power2.inOut"), E_p3io = gsap.parseEase("power3.inOut");
      var SREC = 1.32;                                     // light pull back 2.70 → 3.20
      var S_L = 0.994, CX_L = 330 + 630 / S_L, CY_L = 700 - 160 / S_L;   // landing pose, start point fixed on screen
      function camAt(t) {
        if (t <= 2.70) {
          var s = t < 0.4 ? S0 + (S1 - S0) * E_p2o(t / 0.4) : (t < T1 ? S1 : S1 + (S2 - S1) * E_p2io((t - T1) / L));
          return { s: s, cx: Y0 + travel(t), cy: CY1 };
        }
        if (t <= 3.20) { var e = E_p2o((t - 2.70) / 0.5); return { s: S2 + (SREC - S2) * e, cx: CXE, cy: CY1 }; }
        if (t <= 4.45) {
          var u2 = (t - 3.20) / 1.25, ep = E_p2io(u2), es = E_p3io(u2);
          return { s: SREC + (S_L - SREC) * es, cx: CXE + (CX_L - CXE) * ep, cy: CY1 + (CY_L - CY1) * ep };
        }
        var v = clamp01((t - 4.45) / 0.30);   // slow push toward the start point, +2 %/s
        return { s: S_L + (1 - S_L) * v, cx: CX_L + (960 - CX_L) * v, cy: CY_L + (540 - CY_L) * v };
      }

      var world = $("world"), blurNode = $("streak-blur"), count = $("count");
      var streaked = years.map(function (y) { return y.el; }).concat([$("e1"), $("e2"), $("e3")]);
      var lastBlurOn = null;
      function render(t) {
        var c = camAt(t);
        gsap.set(world, { x: 960 - c.s * c.cx, y: 540 - c.s * c.cy, scale: c.s, transformOrigin: "0px 0px" });
        // directional streak follows the on-screen speed of the timeline : 14 px at 2400 px/s, sharp under 700 px/s, cap 18
        var b = 0;
        if (t < 2.70) {
          var t2 = Math.min(2.70, t + 0.004), c2 = camAt(t2), vs = c.s * (c2.cx - c.cx) / (t2 - t);
          b = Math.min(18, Math.max(0, 14 * (vs - 700) / 1700));
        }
        blurNode.setAttribute("stdDeviation", (b / c.s).toFixed(3) + " 0");
        var on = b > 0.05;
        if (on !== lastBlurOn) { streaked.forEach(function (el) { el.style.filter = on ? "url(#f09-streak)" : "none"; }); lastBlurOn = on; }
        // the year nearest the centre is white (with the soft glow of frame 08), the others ink-mute
        years.forEach(function (y) {
          var sx = 960 + c.s * (y.x - c.cx), w = clamp01(1 - Math.abs(sx - 960) / 260);
          var r = Math.round(138 + 117 * w), g = Math.round(143 + 112 * w), bl = Math.round(152 + 103 * w);
          y.el.style.color = "rgb(" + r + "," + g + "," + bl + ")";
          y.el.style.textShadow = "0 0 16px rgba(255,255,255," + (0.18 * w).toFixed(3) + ")";
        });
        // foreground years slide 1.6x faster (parallax), stop with the camera
        var tr = travel(Math.min(t, 2.70));
        fgItems.forEach(function (f) { gsap.set(f.el, { x: f.x - 3.2 * tr }); });
      }

      /* ---------- the one paused timeline ---------- */
      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      var clock = { t: 0 };
      render(0);
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);

      /* ---- scene 1 : the errors written then struck ---- */
      function writeErr(id, t0, t1) {
        var ch = errChars[id], n = ch.length, dt = (t1 - t0) / n;
        ch.forEach(function (sp, i) {
          ft(sp, { opacity: 0, y: 3, filter: "blur(2px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: Math.max(0.06, dt * 2.2), ease: "power2.out" }, t0 + i * dt);
        });
      }
      function strike(k, t) {
        gsap.set($(k), { scaleX: 0, rotation: -1.2, transformOrigin: "0% 50%" });
        ft($(k), { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.15, ease: "power2.out" }, t);
      }
      writeErr("e1", 0.30, 0.80); strike("k1", 0.98);
      writeErr("e2", 1.05, 1.25); strike("k2", 1.30);
      writeErr("e3", 1.55, 1.75); strike("k3", 1.80);
      // struck errors settle back into the soft ink
      ft($("e1"), { opacity: 1 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 1.13);
      ft($("e2"), { opacity: 1 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 1.45);
      ft($("e3"), { opacity: 1 }, { opacity: 0.6, duration: 0.3, ease: "power1.out" }, 1.95);

      // 1.65 → 2.10 the year counter above the timeline rolls 2010 → 2026
      ft(count, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.15, ease: "power3.out" }, 1.65);
      var roll = { v: 2010 };
      function writeCount() { count.textContent = String(Math.round(roll.v)); }
      writeCount();
      ft(roll, { v: 2010 }, { v: 2026, duration: 0.42, ease: "power2.inOut", onUpdate: writeCount }, 1.68);

      /* ---- scene 2 : toi, then the route ---- */
      // 2.70 the « toi » point lands after 2026 (x1.4 → 1, 0.14 s)
      ft($("toi"), { opacity: 0, scale: 1.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power3.out" }, 2.70);
      // the foreground years leave with the stop of the travelling
      ft($("fgset"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.out" }, 2.75);
      // 3.26 → 4.40 the route draws from the point (svg-path-draw)
      var route = $("route"), glow = $("glow"), LEN = route.getTotalLength();
      [route, glow].forEach(function (p) { p.style.strokeDasharray = LEN + " " + (LEN + 40); p.style.strokeDashoffset = LEN; });
      var DRAW0 = 3.26, DRAWD = 1.14, DRAW_EASE = "sine.inOut";
      tl.set([route, glow], { opacity: 1 }, DRAW0);
      ft([route, glow], { strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: DRAWD, ease: DRAW_EASE }, DRAW0);
      // waypoints light when the tip passes them (measured on the path, eased time inverted)
      var E_draw = gsap.parseEase(DRAW_EASE);
      function lenNear(px, py) { var best = 0, bd = 1e9; for (var l = 0; l <= LEN; l += 2) { var p = route.getPointAtLength(l), dd = (p.x - px) * (p.x - px) + (p.y - py) * (p.y - py); if (dd < bd) { bd = dd; best = l; } } return best; }
      function timeAtFrac(f) { var lo = 0, hi = 1; for (var i = 0; i < 40; i++) { var m = (lo + hi) / 2; if (E_draw(m) < f) lo = m; else hi = m; } return DRAW0 + DRAWD * lo; }
      [["wp1", 760, 500], ["wp2", 1230, 330]].forEach(function (w) {
        var tw = timeAtFrac(lenNear(w[1], w[2]) / LEN);
        ft($(w[0]), { opacity: 0, scale: 1.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power3.out" }, tw);
      });
      ft($("arrive"), { opacity: 0, scale: 1.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.14, ease: "power3.out" }, 4.38);

      // the timeline goes out while the map lights up
      ft($("frise"), { opacity: 1 }, { opacity: 0, duration: 0.65, ease: "power1.inOut" }, 3.55);
      ft(count, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 3.30);
      // 3.80 the GPS roads appear around (staggered fade), the screen frame is complete at 4.40
      ft($("gps"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 3.80);
      Array.prototype.forEach.call(root.querySelectorAll(".f09-road"), function (r, i) {
        ft(r, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.80 + i * 0.03);
      });
      ft($("banner"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, 4.16);

      /* ---- the voice line : word by word, 35 % white then white ; one key-word box per sentence ---- */
      Array.prototype.forEach.call(root.querySelectorAll(".f09-w"), function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f09-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
      });
      ft($("kb1"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 1.63 - FR);
      ft($("kb2"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 3.95 - FR);
      // each chunk leaves before the next one (and before the seam : no subtitle at 4.75)
      ft($("s1"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 1.13);
      ft($("s2"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 2.48);
      ft($("s3"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.07);
      ft($("s4"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 4.52);
      ft($("shade"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.out" }, 4.46);

      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
