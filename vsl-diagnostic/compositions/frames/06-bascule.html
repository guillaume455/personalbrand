  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "06-bascule", DUR = 4.4, FR = 1 / 30;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#f06-" + id); }

      var tl = gsap.timeline({ paused: true });
      function ft(target, from, to, pos) { if (pos > 0) to.immediateRender = false; tl.fromTo(target, from, to, pos); }

      /* ---- split every word into letters (for the convergence) ---- */
      var words = Array.prototype.slice.call(root.querySelectorAll(".f06-w"));
      words.forEach(function (w) {
        var txt = w.textContent; w.textContent = "";
        for (var i = 0; i < txt.length; i++) {
          var c = document.createElement("span"); c.className = "f06-ch"; c.textContent = txt.charAt(i); w.appendChild(c);
        }
      });

      /* ---- camera constants ---- */
      var S_END = 0.92, D0 = S_END / 1.01;     // drift +2 %/s over the last 0.5 s lands exactly on 0.92
      var S_START = 1.6;                        // total scale when the GPS world is born
      var TXT_END = 1 + 0.01 * 3.10;            // text drift z +1 %/s

      // geometry of the "plan" box (layout coords, then through the text drift) -> screen
      function geo() {
        var kw = $("kw"), txt = $("txt"), x = 0, y = 0, el = kw, W = kw.offsetWidth, H = kw.offsetHeight;
        while (el && el !== txt && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
        if (!W || !H) { x = 1010; y = 507; W = 200; H = 98; }
        var cx = x + W / 2, cy = y + H / 2;
        var px = 960 + (cx - 960) * TXT_END, py = 500 + (cy - 500) * TXT_END;
        return { px: px, py: py, W: W * TXT_END, H: H * TXT_END,
          tx: (px - 960) / D0 + 630, ty: (py - 540) / D0 - 160 };
      }

      /* ---- initial (handoff_in) state : black + grain only ---- */
      var camd = $("camd"), camt = $("camt"), cams = $("cams");
      gsap.set(camd, { scale: D0, transformOrigin: "960px 540px" });
      gsap.set(cams, { scale: S_START / D0, transformOrigin: "330px 700px" });
      gsap.set(camt, { x: 1300, y: 300 });
      gsap.set($("mcirc"), { scale: 0.001, transformOrigin: "50% 50%" });

      var edges = ["ea", "eb", "ha", "hb"].map(function (k) {
        var p = $(k), len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = len + " " + len; p.style.strokeDashoffset = String(len);
        return { el: p, len: len };
      });

      /* ===== 0.00 → 0.60 : the three red « ? » of frame 05 keep converging and merge into one point ===== */
      // outer = the inherited 60 px/s drift (linear), inner = the power2.in acceleration ; sum lands on (960, 520) at 0.50
      ft($("qa"), { x: 0 }, { x: 30, duration: 0.5, ease: "none" }, 0);
      ft($("qai"), { x: 0 }, { x: 50, duration: 0.5, ease: "power2.in" }, 0);
      ft($("qc"), { x: 0 }, { x: -30, duration: 0.5, ease: "none" }, 0);
      ft($("qci"), { x: 0 }, { x: -50, duration: 0.5, ease: "power2.in" }, 0);
      ft($("qb"), { y: 0 }, { y: 20, duration: 1 / 3, ease: "none" }, 0);
      // they shrink as they merge, then hand over to a single small red point
      ft([$("qag"), $("qbg"), $("qcg")], { scale: 1 }, { scale: 0.12, duration: 0.3, ease: "power2.in" }, 0.20);
      ft([$("qag"), $("qbg"), $("qcg")], { opacity: 1 }, { opacity: 0, duration: 0.06, ease: "none" }, 0.44);
      ft($("qdot"), { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.06, ease: "power2.out" }, 0.44);
      ft($("qdot"), { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.4, duration: 0.1, ease: "power2.in" }, 0.50);

      /* ===== SCENE 1 (0.00 → 3.10) : the question on black ===== */
      // 0.00 → 3.10 drift z +1 %/s on the sentence
      ft($("txt"), { scale: 1 }, { scale: TXT_END, duration: 3.10, ease: "none" }, 0);

      // word by word : 35 % white then white (pilot), letters converge (0.3 s expo.out)
      words.forEach(function (w) {
        var cue = parseFloat(w.getAttribute("data-cue")) - FR, kw = w.classList.contains("f06-kt");
        ft(w, { opacity: 0, y: 8, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, cue);
        if (kw) ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#1a1b1f", duration: 0.1, ease: "none" }, cue + 0.04);
        else ft(w, { color: "rgba(255,255,255,0.35)" }, { color: "#ffffff", duration: 0.2, ease: "power1.out" }, cue + 0.1);
        var ch = w.querySelectorAll(".f06-ch"), n = ch.length;
        for (var i = 0; i < n; i++) {
          ft(ch[i], { x: (i - (n - 1) / 2) * 22 }, { x: 0, duration: 0.3, ease: "expo.out" }, cue);
        }
      });
      // key-word box on "plan" (2.78)
      ft($("kb"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power3.out" }, 2.78 - FR);

      // 1.80 → 2.20 "Et si tu essayais…" glides 40 px up to make room
      ft($("l1"), { y: 0 }, { y: -40, duration: 0.4, ease: "power3.out" }, 1.80);

      /* ===== SCENE 2 (3.10 → 4.40) : the GPS lights up ===== */
      // 3.10 the sentence leaves (box excepted)
      var plain = words.filter(function (w) { return !w.classList.contains("f06-kt"); });
      var boxed = root.querySelector(".f06-kt");
      ft(plain, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, 3.10);
      // the word inside the box goes first so the box contracts clean
      ft(boxed, { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none" }, 3.10);

      // 3.10 → 3.18 the box contracts into a point (centre), 3.16 → 3.20 it hands over to the round point
      var DOT_318 = 58 * (1 + (S_START / D0 - 1) * 0.5) * D0;   // screen diameter of the start point at 3.18 (expo.out p = 0.5)
      tl.set($("kb"), { transformOrigin: "50% 50%" }, 3.10);
      ft($("kb"), { scaleX: 1, scaleY: 1 },
        { scaleX: function () { return DOT_318 / geo().W; }, scaleY: function () { return DOT_318 / geo().H; }, duration: 0.08, ease: "power3.in" }, 3.10);
      ft($("kb"), { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none" }, 3.16);
      tl.set($("dot"), { opacity: 1 }, 3.16);
      ft($("dotor"), { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 3.16);
      // 3.20 → 3.30 orange turns to the rim-blue point with its white ring
      ft($("dotor"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.out" }, 3.20);
      ft($("dotglow"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.24);

      // camera : recoil 1.6 → 0.92 (expo.out, around the point), the point holds where the box was then travels to its place
      ft(cams, { scale: S_START / D0 }, { scale: 1, duration: 0.8, ease: "expo.out" }, 3.10);
      ft(camt, { x: function () { return geo().tx; }, y: function () { return geo().ty; } },
        { x: function () { return geo().tx; }, y: function () { return geo().ty; }, duration: 0.1, ease: "none" }, 3.10);
      ft(camt, { x: function () { return geo().tx; }, y: function () { return geo().ty; } },
        { x: 0, y: 0, duration: 0.7, ease: "power3.inOut" }, 3.20);
      // 3.90 → 4.40 slow push +2 %/s, centred
      ft(camd, { scale: D0 }, { scale: S_END, duration: 0.5, ease: "none" }, 3.90);

      // the stage (canvas, blue arc at the top) comes up behind
      ft($("stage"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 3.30);

      // 3.40 → 3.90 the screen edge traces around (svg-path-draw), a light leading stroke then settles to the bezel border
      edges.forEach(function (e, i) {
        ft(e.el, { strokeDashoffset: e.len }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 3.40);
      });
      ft([$("ha"), $("hb")], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 3.90);
      ft($("bezel"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.46);
      ft($("shadow"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.46);
      ft($("sheen"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.50);

      // 3.60 roads appear as a gradient spreading from the point
      tl.set($("roads"), { opacity: 1 }, 3.60);
      ft($("mcirc"), { scale: 0.001 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 3.60);

      // 3.90 the banner : x1.1 blur 4 -> sharp, 0.14 s
      ft($("banner"), { opacity: 0, scale: 1.1, filter: "blur(4px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, 3.90);

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
