<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Anton"; src: url("../assets/fonts/Anton-400.woff2") format("woff2"); }
@font-face { font-family: "Space Mono"; src: url("../assets/fonts/SpaceMono-700.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; background: #0A0A0A; }
#c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0A; }
.ph { position: absolute; object-fit: cover; filter: saturate(1.25) contrast(1.08); }
#hero { left: 0; top: 0; width: 1080px; height: 1240px; object-position: 50% 62%; filter: saturate(1.25) contrast(1.1) brightness(1.18); }
#fade { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
  background: linear-gradient(rgba(10,10,10,0.75) 0%, rgba(10,10,10,0.1) 18%, rgba(10,10,10,0) 34%, rgba(10,10,10,0.55) 48%, #0A0A0A 64%); }
#hook { position: absolute; left: 0; top: 300px; width: 1080px; text-align: center; }
#hook span { display: inline-block; padding: 10px 30px; border-radius: 40px; background: #FB8000; color: #0A0A0A;
  font: 50px/1.2 "Anton", sans-serif; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
#t { position: absolute; left: 0; top: 760px; width: 1080px; text-align: center; color: #fff; font: 280px/1 "Anton", sans-serif;
  letter-spacing: 0.01em; text-shadow: 0 10px 50px rgba(0,0,0,0.6); }
#t i { position: relative; display: inline-block; font-style: normal; }
#t i:after { content: ""; position: absolute; left: -2%; right: -2%; bottom: -0.04em; height: 0.09em; background: #FB8000;
  border-radius: 999px; transform: rotate(-1.5deg); clip-path: polygon(0 0, 100% 32%, 100% 68%, 0 100%); }
#s { position: absolute; left: 0; top: 1075px; width: 1080px; text-align: center; color: #FB8000; font: 78px/1.1 "Anton", sans-serif;
  text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
.tile { position: absolute; top: 1220px; width: 320px; height: 400px; border-radius: 22px; overflow: hidden; border: 3px solid #2e2e2e;
  box-shadow: 0 16px 40px rgba(0,0,0,0.55); }
.tile img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.25) contrast(1.08); }
.tile b { position: absolute; left: 0; bottom: 0; width: 100%; padding: 60px 0 16px; text-align: center; font: 40px/1 "Anton", sans-serif;
  color: #fff; font-weight: 400; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.8)); }
.tile.or { border-color: #FB8000; }
#k { position: absolute; left: 0; top: 1665px; width: 1080px; text-align: center; font: 700 30px/1 "Space Mono", monospace;
  color: #9a9a9a; letter-spacing: 0.14em; }
</style></head><body><div id="c">
<img id="hero" class="ph" src="bugatti.jpg">
<div id="fade"></div>
<div id="hook"><span>EN FRANCE, ÇA N'EXISTE PAS.</span></div>
<div id="t"><i>DUBAÏ</i></div>
<div id="s">C'EST PAS LE MÊME DÉLIRE</div>
<div class="tile" style="left:30px"><img src="rolls.jpg" style="object-position:50% 40%"><b>ROLLS-ROYCE</b></div>
<div class="tile or" style="left:380px"><img src="brabus.jpg" style="object-position:55% 40%"><b>BRABUS</b></div>
<div class="tile" style="left:730px"><img src="enzo.jpg" style="object-position:62% 62%;transform:scale(1.6);transform-origin:62% 62%"><b>FERRARI ENZO</b></div>
<div id="k">RASSEMBLEMENTS AUTO · 2024-2026</div>
</div></body></html>
