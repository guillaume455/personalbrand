<template>
  <style>
    @font-face { font-family: "Big Shoulders"; src: url("assets/fonts/BigShoulders-900.woff2") format("woff2"); font-weight: 900; }
    @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-700.woff2") format("woff2"); font-weight: 700; }

    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #ffffff;
      font-family: "Instrument Sans", sans-serif; -webkit-font-smoothing: antialiased; }

    /* ===================== SHARED: ground ===================== */
    /* solid #0A0A0A + one soft accent halo behind the focal element + static grain 4 %.
       Full-duration class="clip" layer on track 0. Move the halo by tweening its x / y / scale / opacity only. */
    .f01-ground { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #0A0A0A; overflow: hidden; }
    .f01-halo { position: absolute; left: -60px; top: 300px; width: 1200px; height: 1200px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(251,128,0,0.16) 0%, rgba(251,128,0,0.10) 38%, rgba(251,128,0,0.035) 70%, rgba(251,128,0,0) 100%); }
    .f01-grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0.04; mix-blend-mode: screen; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
      background-size: 240px 240px; }
    /* ===================== end SHARED: ground ===================== */

    /* ===================== SHARED: title ===================== */
    /* Scene title: Big Shoulders 900, 128 px, caps, line-height 0.95, white, centred in the title zone (y 260 to 640,
       side margins 80 px). The orange title-stroke sits under the LAST line: it is sized in em, so it is always
       "line width + 20 px" (10 px each side at 128 px), 14 px tall, round cap at the left, tapered end, tilted -1.5 deg.
       Markup:
         <div class="f01-title" style="top: ...px">
           <span class="f01-tline">LINE 1</span><br>
           <span class="f01-tline">LINE 2<i class="f01-stroke-tilt"><i class="f01-stroke" id="f01-..."></i></i></span>
         </div>
       The same component scales with font-size (this frame uses it at the jumbo size, 300 px). */
    .f01-title { position: absolute; left: 80px; width: 920px; text-align: center; font: 900 128px/0.95 "Big Shoulders", sans-serif;
      text-transform: uppercase; color: #ffffff; white-space: nowrap; }
    .f01-tline { position: relative; display: inline-block; }
    .f01-stroke-tilt { position: absolute; left: -0.078em; right: -0.078em; bottom: -0.085em; height: 0.11em; display: block;
      transform: rotate(-1.5deg); transform-origin: 0 50%; }
    .f01-stroke { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #FB8000;
      border-radius: 999px; clip-path: polygon(0 0, 100% 32%, 100% 68%, 0 100%);
      transform-origin: 0 50%; transform: scaleX(0); }
    /* ===================== end SHARED: title ===================== */

    /* ===================== SHARED: subtitle ===================== */
    /* The voice, word by word, in the subtitle band (y 1260 to 1440, nothing else in it): Instrument Sans 700 58/70,
       centred on y 1350. One .f01-chunk per quoted chunk (2 to 6 words), all chunks stacked at the same place.
       Every word is a .f01-w with data-cue (frame-local s); the key word also carries .f01-key (turns #FB8000 as it
       appears, no box). data-out on the chunk = its 0.1 s leave (opacity + blur) before the next chunk. */
    .f01-sub { position: absolute; left: 0; top: 1260px; width: 1080px; height: 180px; pointer-events: none; }
    .f01-chunk { position: absolute; left: 40px; top: 55px; width: 1000px; text-align: center; white-space: nowrap;
      font: 700 58px/70px "Instrument Sans", sans-serif; color: #ffffff; text-shadow: 0 3px 18px rgba(0,0,0,0.7); }
    .f01-w { display: inline-block; opacity: 0; }
    /* ===================== end SHARED: subtitle ===================== */

    /* ---- camera (two stacked wrappers: continuous push / discrete crans), origin on the frame focal point ---- */
    .f01-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 900px; }

    /* ---- the date (jumbo 300 px, two lines « 11 AOÛT » / « 2026 ») ---- */
    #f01-date { position: absolute; left: 0; top: 630px; width: 1080px; height: 540px; transform-origin: 540px 270px; }
    .f01-jumbo { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap;
      font: 900 300px/0.9 "Big Shoulders", sans-serif; text-transform: uppercase; color: #ffffff; }
    #f01-l1 { top: 0; }
    #f01-l2 { top: 270px; }
    .f01-part { position: relative; display: inline-block; vertical-align: top; }
    #f01-aout { margin-left: 61px; opacity: 0; }
    #f01-y2026 { opacity: 0; }
    .f01-reel { position: relative; display: inline-block; vertical-align: top; width: 158px; height: 270px; overflow: hidden; }
    .f01-reel-col { position: absolute; left: 0; top: 0; width: 158px; }
    .f01-reel-col span { display: block; height: 270px; text-align: center; }

    /* ---- phone component: white line icon 220×420, 10 px stroke, speaker slot, home bar; accent strike 22 px ---- */
    #f01-phone { position: absolute; left: 396px; top: 636px; width: 288px; height: 528px; opacity: 0; transform-origin: 144px 264px; }
    #f01-phone-shake { position: absolute; left: 0; top: 0; width: 288px; height: 528px; transform-origin: 144px 264px; }
    .f01-phone-svg { position: absolute; left: 0; top: 0; width: 288px; height: 528px; overflow: visible; }
    .f01-phone-svg rect, .f01-phone-svg line { fill: none; stroke-linecap: round; }
    #f01-phone-live rect, #f01-phone-live line { stroke: #ffffff; }
    #f01-phone-dead { opacity: 0; }
    #f01-phone-dead rect, #f01-phone-dead line { stroke: #3a3a3a; }
    #f01-strike { fill: none; stroke: #FB8000; stroke-width: 18.4; stroke-linecap: round; stroke-dasharray: 423; stroke-dashoffset: 423; }
  </style>

  <div id="root" data-composition-id="01-date" data-width="1080" data-height="1920" data-duration="3.26">

    <!-- SHARED: ground (full-duration clip, lowest track) -->
    <div id="f01-ground" class="clip f01-ground" data-start="0" data-duration="3.26" data-track-index="0">
      <div id="f01-halo" class="f01-halo"></div>
      <div class="f01-grain"></div>
    </div>

    <!-- camera: push (continuous +2 %/s) > cran (reframes at 0.60 and 1.60, push 2.80) > scene -->
    <div id="f01-push" class="f01-cam">
      <div id="f01-cran" class="f01-cam">

        <!-- the date: becomes the scene title at 1.60 (300 px x 0.4267 = the 128 px title, stroke 33 px -> 14 px) -->
        <div id="f01-date">
          <div id="f01-l1" class="f01-jumbo"><span id="f01-d11" class="f01-part">11</span><span id="f01-aout" class="f01-part">AOÛT</span></div>
          <div id="f01-l2" class="f01-jumbo"><span id="f01-y2026" class="f01-part f01-tline">202<span class="f01-reel"><span id="f01-reel-col" class="f01-reel-col"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></span></span><i class="f01-stroke-tilt"><i id="f01-stroke" class="f01-stroke"></i></i></span></div>
        </div>

        <!-- the phone, struck through in orange, then greyed out -->
        <div id="f01-phone">
          <div id="f01-phone-shake">
            <svg id="f01-phone-live" class="f01-phone-svg" viewBox="0 0 240 440" xmlns="http://www.w3.org/2000/svg">
              <rect x="10" y="10" width="220" height="420" rx="38" ry="38" stroke-width="8.4"></rect>
              <line x1="98" y1="46" x2="142" y2="46" stroke-width="8.4"></line>
              <line x1="92" y1="396" x2="148" y2="396" stroke-width="8.4"></line>
            </svg>
            <svg id="f01-phone-dead" class="f01-phone-svg" viewBox="0 0 240 440" xmlns="http://www.w3.org/2000/svg">
              <rect x="10" y="10" width="220" height="420" rx="38" ry="38" stroke-width="8.4"></rect>
              <line x1="98" y1="46" x2="142" y2="46" stroke-width="8.4"></line>
              <line x1="92" y1="396" x2="148" y2="396" stroke-width="8.4"></line>
            </svg>
            <svg class="f01-phone-svg" viewBox="0 0 240 440" xmlns="http://www.w3.org/2000/svg">
              <path id="f01-strike" d="M -30 68 L 270 372"></path>
            </svg>
          </div>
        </div>

      </div>
    </div>

    <!-- SHARED: subtitle (outside the camera: it never moves with the scene) -->
    <div id="f01-sub" class="f01-sub">
      <div class="f01-chunk" data-out="0.72"><span class="f01-w" data-cue="0.05">Si</span> <span class="f01-w" data-cue="0.18">tu</span> <span class="f01-w" data-cue="0.31">trouves</span> <span class="f01-w" data-cue="0.43">tes</span> <span class="f01-w f01-key" data-cue="0.56">mandats</span></div>
      <div class="f01-chunk" data-out="1.56"><span class="f01-w" data-cue="0.82">au</span> <span class="f01-w" data-cue="0.95">téléphone,</span></div>
      <div class="f01-chunk" data-out="2.20"><span class="f01-w" data-cue="1.66">t'as</span> <span class="f01-w" data-cue="1.82">un</span> <span class="f01-w f01-key" data-cue="1.98">problème</span></div>
      <div class="f01-chunk" data-out="3.16"><span class="f01-w" data-cue="2.30">depuis</span> <span class="f01-w" data-cue="2.63">le</span> <span class="f01-w" data-cue="2.79">onze</span> <span class="f01-w" data-cue="2.95">août.</span></div>
    </div>

  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "01-date";
      var DUR = 3.26;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + id); }
      var tl = gsap.timeline({ paused: true });

      /* ===================== SHARED: title (JS) ===================== */
      // Title slam: scale 1.25 -> 1, blur 10 -> 0, 0.18 s expo.out (t0 > 0: the element starts at opacity 0 in CSS).
      function f01TitleIn(tl, el, t0) {
        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, t0);
      }
      // Orange stroke: draws from the left, scaleX 0 -> 1, 0.3 s power3.out.
      function f01StrokeDraw(tl, el, t0) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
      }
      /* ===================== end SHARED: title (JS) ===================== */

      /* ===================== SHARED: subtitle (JS) ===================== */
      // Each word appears 1 frame before its cue (never late): opacity 0 -> 1, y 14 -> 0, blur 6 -> 0 in 0.12 s.
      // The key word turns #FB8000 as it appears. A chunk leaves at its data-out in 0.1 s (opacity + blur).
      var F01_LEAD = 1 / 30;
      function f01Subtitle(tl, box) {
        Array.prototype.forEach.call(box.querySelectorAll(".f01-chunk"), function (ch) {
          Array.prototype.forEach.call(ch.querySelectorAll(".f01-w"), function (w) {
            var t = Math.max(0, parseFloat(w.getAttribute("data-cue")) - F01_LEAD);
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            if (w.classList.contains("f01-key")) {
              tl.fromTo(w, { color: "#ffffff" }, { color: "#FB8000", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            }
          });
          var out = ch.getAttribute("data-out");
          if (out) {
            tl.fromTo(ch, { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power3.out", immediateRender: false }, parseFloat(out));
          }
        });
      }
      /* ===================== end SHARED: subtitle (JS) ===================== */

      /* ---- camera track (apart from the object tweens) ---- */
      // push +2 %/s over the whole frame
      tl.fromTo($("f01-push"), { scale: 1 }, { scale: 1 + 0.02 * DUR, duration: DUR, ease: "none" }, 0);
      // before 0.60 the camera frames « 11 » alone at the centre (line 1 lifted down by 135 px)
      tl.fromTo($("f01-cran"), { y: 135, scale: 1 }, { y: 135, scale: 1, duration: 0.01, ease: "none" }, 0);
      // cran 0.60: reframe for the two lines
      tl.fromTo($("f01-cran"), { y: 135 }, { y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.60);
      // cran 1.60: a step in, as the scene changes
      tl.fromTo($("f01-cran"), { scale: 1 }, { scale: 1.03, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.60);
      // 2.80 -> 3.26: final push on the struck phone
      tl.fromTo($("f01-cran"), { scale: 1.03 }, { scale: 1.055, duration: 0.46, ease: "power3.out", immediateRender: false }, 2.80);

      /* ---- Scene 1 (0.00 -> 1.60): the date slams, beat by beat ---- */
      var d11 = $("f01-d11"), aout = $("f01-aout"), y26 = $("f01-y2026");
      // 0.00 « 11 » slams at the centre (x +328 = centred alone), x1.4 blur 10 -> sharp in 0.15 s
      tl.fromTo(d11, { x: 328, scale: 1.4, filter: "blur(10px)", opacity: 1 },
        { x: 328, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.15, ease: "expo.out" }, 0);
      // 0.30 « AOÛT » snaps in from the right while « 11 » slides over to make room
      tl.fromTo(d11, { x: 328 }, { x: 0, duration: 0.24, ease: "power3.out", immediateRender: false }, 0.30);
      tl.fromTo(aout, { opacity: 0, x: 240, scale: 1.12, filter: "blur(12px)" },
        { opacity: 1, x: 0, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 0.30);
      // 0.60 « 2026 » slams in underneath, rising, its last digit rolls 0 -> 6 (0.25 s)
      tl.fromTo(y26, { opacity: 0, y: 150, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 0.60);
      tl.fromTo($("f01-reel-col"), { y: 0 }, { y: -6 * 270, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.60);
      // 0.95 the orange stroke draws under « 2026 »
      f01StrokeDraw(tl, $("f01-stroke"), 0.95);
      // 1.25 the halo swells behind the date
      tl.fromTo($("f01-halo"), { scale: 1, opacity: 1 }, { scale: 1.14, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 1.25);

      /* ---- Scene 2 (1.60 -> 3.26): the phone, struck through ---- */
      // 1.60 the date rises and shrinks into the title zone (becomes the 128 px title, centre y 450)
      tl.fromTo($("f01-date"), { y: 0, scale: 1 }, { y: -450, scale: 128 / 300, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.60);
      tl.fromTo($("f01-halo"), { y: 0 }, { y: 30, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.60);
      // 1.75 the phone arrives in the visual zone, x1.3 blur -> sharp in 0.18 s
      tl.fromTo($("f01-phone"), { opacity: 0, scale: 1.3, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 1.75);
      // 1.98 on « problème » the orange strike crosses it diagonally (svg path draw, 0.25 s)
      var strike = $("f01-strike");
      var len = 423;
      try { len = Math.ceil(strike.getTotalLength()) + 1; } catch (e) {}
      strike.style.strokeDasharray = len;
      strike.style.strokeDashoffset = len;
      tl.fromTo(strike, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.98);
      // 2.30 the phone shakes twice (rotation +-3 deg, 0.08 s per swing) ...
      var sh = $("f01-phone-shake");
      tl.fromTo(sh, { rotation: 0 }, { rotation: 3, duration: 0.04, ease: "sine.out", immediateRender: false }, 2.30);
      tl.fromTo(sh, { rotation: 3 }, { rotation: -3, duration: 0.08, ease: "sine.inOut", immediateRender: false }, 2.34);
      tl.fromTo(sh, { rotation: -3 }, { rotation: 3, duration: 0.08, ease: "sine.inOut", immediateRender: false }, 2.42);
      tl.fromTo(sh, { rotation: 3 }, { rotation: -3, duration: 0.08, ease: "sine.inOut", immediateRender: false }, 2.50);
      tl.fromTo(sh, { rotation: -3 }, { rotation: 0, duration: 0.04, ease: "sine.out", immediateRender: false }, 2.58);
      // ... then greys out (white line -> dead #3a3a3a, the strike stays orange)
      tl.fromTo($("f01-phone-live"), { opacity: 1 }, { opacity: 0, duration: 0.24, ease: "power3.out", immediateRender: false }, 2.60);
      tl.fromTo($("f01-phone-dead"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power3.out", immediateRender: false }, 2.60);

      /* ---- the voice, word by word ---- */
      f01Subtitle(tl, $("f01-sub"));

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
