  <script>
    (function () {
      var FID = "12-louer";
      var DUR = 3.92;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + id); }
      var tl = gsap.timeline({ paused: true });

      /* ===================== SHARED: title (JS) ===================== */
      // Title slam: scale 1.25 -> 1, blur 10 -> 0, 0.18 s expo.out (t0 > 0: the element starts at opacity 0 in CSS).
      function f12TitleIn(tl, el, t0) {
        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, t0);
      }
      // Orange stroke: draws from the left, scaleX 0 -> 1, 0.3 s power3.out.
      function f12StrokeDraw(tl, el, t0) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
      }
      /* ===================== end SHARED: title (JS) ===================== */

      /* ===================== SHARED: subtitle (JS) ===================== */
      // Each word appears 1 frame before its cue (never late): opacity 0 -> 1, y 14 -> 0, blur 6 -> 0 in 0.12 s.
      // The key word turns #FB8000 as it appears. A chunk leaves at its data-out in 0.1 s (opacity + blur).
      var F12_LEAD = 1 / 30;
      function f12Subtitle(tl, box) {
        Array.prototype.forEach.call(box.querySelectorAll(".f12-chunk"), function (ch) {
          Array.prototype.forEach.call(ch.querySelectorAll(".f12-w"), function (w) {
            var t = Math.max(0, parseFloat(w.getAttribute("data-cue")) - F12_LEAD);
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            if (w.classList.contains("f12-key")) {
              tl.fromTo(w, { color: "#ffffff" }, { color: "#FB8000", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            }
          });
          var out = ch.getAttribute("data-out");
          if (out) {
            tl.fromTo(ch, { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power3.out", immediateRender: false }, parseFloat(out));
          }
        });
      }
      /* ===================== end SHARED: subtitle (JS) ===================== */

      /* ---- camera: slow push +1 %/s, the whole frame (binding for the handoff) ---- */
      tl.fromTo($("f12-push"), { scale: 1 }, { scale: 1 + 0.01 * DUR, duration: DUR, ease: "none" }, 0);

      /* ---- 0.14 « Le » : block 1 slams with its small phone ---- */
      f12TitleIn(tl, $("f12-t1"), 0.14);
      // 0.32 « téléphone » : the orange strike crosses the small phone (svg path draw, 0.22 s)
      var strike = $("f12-strike");
      var len = 423;
      try { len = Math.ceil(strike.getTotalLength()) + 1; } catch (e) {}
      strike.style.strokeDasharray = len;
      strike.style.strokeDashoffset = len;
      tl.fromTo(strike, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 0.32);
      // 0.32 the phone kicks as it is struck (scale 1 -> 1.12 -> 1)
      tl.fromTo($("f12-phone"), { scale: 1 }, { scale: 1.12, duration: 0.1, ease: "power3.out", immediateRender: false }, 0.32);
      tl.fromTo($("f12-phone"), { scale: 1.12 }, { scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 0.42);
      // 0.70 the halo breathes up behind the title (centre y 600 -> 640)
      tl.fromTo($("f12-halo"), { y: -300, scale: 0.92 }, { y: -300, scale: 0.92, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($("f12-halo"), { scale: 0.92 }, { scale: 1.02, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.70);

      /* ---- 1.20 « louer » : block 2 slams, 1.40 the stroke draws ---- */
      f12TitleIn(tl, $("f12-t2"), 1.20);
      // block 1 gets a tiny recoil under the hit (y 0 -> -10 -> settles at -6)
      tl.fromTo($("f12-t1"), { y: 0 }, { y: -6, duration: 0.3, ease: "expo.out", immediateRender: false }, 1.20);
      f12StrokeDraw(tl, $("f12-stroke"), 1.40);
      // 1.70 the halo slides down towards the meter (centre y 640 -> 760)
      tl.fromTo($("f12-halo"), { y: -300 }, { y: -140, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.70);
      tl.fromTo($("f12-halo"), { scale: 1.02 }, { scale: 1.10, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.70);

      /* ---- 2.00 « et » : the meter appears « JOUR 1 », rolls faster and faster to « JOUR 214 » at 3.90 ---- */
      tl.fromTo($("f12-meter"), { opacity: 0, scale: 1.18, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 2.00);
      // the strip « 1 » … « 214 » is built synchronously (deterministic), then rolled by y, snapped to whole rows
      var col = $("f12-num-col");
      var N = 214, ROW = 70;
      for (var i = 1; i <= N; i++) { var r = document.createElement("span"); r.textContent = String(i); col.appendChild(r); }
      var C0 = 2.00, C1 = 3.90, CD = C1 - C0;
      tl.fromTo(col, { y: 0 }, { y: -(N - 1) * ROW, duration: CD, ease: "power2.in", snap: { y: ROW }, immediateRender: false }, C0);
      // counting-dynamic-scale: the number gains weight as it rolls (same window + ease)
      tl.fromTo($("f12-counter"), { scale: 0.8 }, { scale: 1, duration: CD, ease: "power2.in", immediateRender: false }, C0);
      // the tick ribbon scrolls left, accelerating with the count, then keeps going at full speed to the cut
      tl.fromTo($("f12-ribbon"), { x: 0 }, { x: -7064, duration: CD, ease: "power2.in", immediateRender: false }, C0);
      tl.fromTo($("f12-ribbon"), { x: -7064 }, { x: -7200, duration: DUR - C1, ease: "none", immediateRender: false }, C1);
      // before 2.00 the counter shows its start size (the meter is still hidden)
      tl.fromTo($("f12-counter"), { scale: 0.8 }, { scale: 0.8, duration: 0.01, ease: "none" }, 0);

      /* ---- the voice, word by word ---- */
      f12Subtitle(tl, $("f12-sub"));

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
