  <script>
    (function () {
      var FID = "04-trois";
      var DUR = 3.88;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + id); }
      var tl = gsap.timeline({ paused: true });

      /* ===================== SHARED: title (JS) ===================== */
      // Title slam: scale 1.25 -> 1, blur 10 -> 0, 0.18 s expo.out (t0 > 0: the element starts at opacity 0 in CSS).
      function f04TitleIn(tl, el, t0) {
        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, t0);
      }
      // Orange stroke: draws from the left, scaleX 0 -> 1, 0.3 s power3.out.
      function f04StrokeDraw(tl, el, t0) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
      }
      /* ===================== end SHARED: title (JS) ===================== */

      /* ===================== SHARED: subtitle (JS) ===================== */
      // Each word appears 1 frame before its cue (never late): opacity 0 -> 1, y 14 -> 0, blur 6 -> 0 in 0.12 s.
      // The key word turns #FB8000 as it appears. A chunk leaves at its data-out in 0.1 s (opacity + blur).
      var F04_LEAD = 1 / 30;
      function f04Subtitle(tl, box) {
        Array.prototype.forEach.call(box.querySelectorAll(".f04-chunk"), function (ch) {
          Array.prototype.forEach.call(ch.querySelectorAll(".f04-w"), function (w) {
            var t = Math.max(0, parseFloat(w.getAttribute("data-cue")) - F04_LEAD);
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            if (w.classList.contains("f04-key")) {
              tl.fromTo(w, { color: "#ffffff" }, { color: "#FB8000", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            }
          });
          var out = ch.getAttribute("data-out");
          if (out) {
            tl.fromTo(ch, { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power3.out", immediateRender: false }, parseFloat(out));
          }
        });
      }
      /* ===================== end SHARED: subtitle (JS) ===================== */

      /* ---- year ticks (static geometry, same as 03) ---- */
      var SVGNS = "http://www.w3.org/2000/svg";
      var ticks = $("f04-ticks");
      for (var yr = 2010; yr <= 2026; yr++) {
        var tx = 200 + 52.5 * (yr - 2010);
        var ln = document.createElementNS(SVGNS, "line");
        ln.setAttribute("x1", tx); ln.setAttribute("x2", tx);
        ln.setAttribute("y1", 1160); ln.setAttribute("y2", 1174);
        ticks.appendChild(ln);
      }

      // eases whose start slope matches the incoming speed (seamless acceleration, no stall)
      function accel(k) { return function (u) { return k * u + (1 - k) * u * u; }; }

      /* ---- camera track ---- */
      var cam = $("f04-cam"), cran = $("f04-cran");
      // 0 -> 2.57 travelling +40 px/s, continued from 03 (x -140 at 0)
      tl.fromTo(cam, { x: -140 }, { x: -140 - 40 * 2.57, duration: 2.57, ease: "none" }, 0);
      // 2.57 -> 3.20 the travelling accelerates (start slope 40 px/s: k = 40 / (157.2 / 0.63))
      tl.fromTo(cam, { x: -242.8 }, { x: -400, duration: 0.63, ease: accel(0.16), immediateRender: false }, 2.57);
      // 3.20 -> 3.60 cran onto the end label, then a slow drift to the cut
      tl.fromTo(cam, { x: -400 }, { x: -560, duration: 0.40, ease: "power3.out", immediateRender: false }, 3.20);
      tl.fromTo(cam, { x: -560 }, { x: -575, duration: 0.28, ease: "none", immediateRender: false }, 3.60);
      tl.fromTo(cran, { scale: 1 }, { scale: 1, duration: 0.01, ease: "none" }, 0);
      tl.fromTo(cran, { scale: 1 }, { scale: 1.05, duration: 0.68, ease: "power2.out", immediateRender: false }, 3.20);

      /* ---- halo: from the left (as in 03) it follows the fall towards the end label ---- */
      var halo = $("f04-halo");
      tl.fromTo(halo, { x: 0, y: 0, scale: 1.12, opacity: 1 }, { x: 0, y: 0, scale: 1.12, opacity: 1, duration: 0.01, ease: "none" }, 0);
      tl.fromTo(halo, { x: 0, y: 0 }, { x: 500, y: -20, duration: 1.3, ease: "power3.inOut", immediateRender: false }, 1.90);
      tl.fromTo(halo, { scale: 1.12 }, { scale: 1.3, duration: 0.5, ease: "power3.out", immediateRender: false }, 3.35);

      /* ---- the curve: keeps drawing at 166.7 u/s, then dives to 2026 (1.90 -> 2.80) ---- */
      var curve = $("f04-curve");
      tl.fromTo(curve, { strokeDashoffset: 640 }, { strokeDashoffset: 323.3, duration: 1.90, ease: "none" }, 0);
      // power2.in-like dive whose start slope equals 166.7 u/s (k = 166.7 / (323.3 / 0.9))
      tl.fromTo(curve, { strokeDashoffset: 323.3 }, { strokeDashoffset: 0, duration: 0.90, ease: accel(0.464), immediateRender: false }, 1.90);

      /* ---- start label: a pulse on « neuf », then it greys back as the line falls ---- */
      var label = $("f04-label");
      tl.fromTo($("f04-ring"), { opacity: 0.8, scale: 0.6 }, { opacity: 0, scale: 2.2, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.29);
      tl.fromTo(label, { scale: 1 }, { scale: 1.1, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.52);
      tl.fromTo(label, { scale: 1.1 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, 1.68);
      tl.fromTo($("f04-nine"), { scale: 1 }, { scale: 1.25, duration: 0.16, ease: "power3.out", immediateRender: false }, 1.52);
      tl.fromTo($("f04-nine"), { scale: 1.25 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, 1.68);
      tl.fromTo($("f04-ring"), { opacity: 0.8, scale: 0.6 }, { opacity: 0, scale: 2.4, duration: 0.45, ease: "power3.out", immediateRender: false }, 1.55);
      tl.fromTo(label, { opacity: 1 }, { opacity: 0.35, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.57);
      tl.fromTo($("f04-dot"), { opacity: 1 }, { opacity: 0.35, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.57);

      /* ---- 2.80 the line lands on 2026 ; 3.00 the accent end point ---- */
      tl.fromTo($("f04-y2026w"), { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, 2.80);
      tl.fromTo($("f04-end"), { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 3.00);
      tl.fromTo($("f04-endring"), { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 2.4, duration: 0.5, ease: "power3.out", immediateRender: false }, 3.00);

      /* ---- 3.35 on « trois » : « 2026 : 3 » slams, the 3 rolls 9 -> 3 (count + scale, same ease) ---- */
      var endl = $("f04-endlabel"), three = $("f04-three");
      tl.fromTo(endl, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 3.33);
      tl.fromTo($("f04-reel3"), { y: 0 }, { y: -6 * 198, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.35);
      tl.fromTo(three, { scale: 0.6 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.35);
      // 3.40 -> 3.88 breath: the 3 swells once, the line casts an orange shadow
      tl.fromTo(three, { scale: 1 }, { scale: 1.05, duration: 0.2, ease: "power3.out", immediateRender: false }, 3.66);
      tl.fromTo($("f04-shadow"), { opacity: 0 }, { opacity: 0.55, duration: 0.45, ease: "power3.out", immediateRender: false }, 3.40);

      /* ---- the voice, word by word ---- */
      f04Subtitle(tl, $("f04-sub"));

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
