<template>
  <style>
    @font-face { font-family: "Big Shoulders"; src: url("assets/fonts/BigShoulders-900.woff2") format("woff2"); font-weight: 900; }
    @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-700.woff2") format("woff2"); font-weight: 700; }

    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #ffffff;
      font-family: "Instrument Sans", sans-serif; -webkit-font-smoothing: antialiased; }

    /* ===================== SHARED: ground ===================== */
    /* solid #0A0A0A + one soft accent halo behind the focal element + static grain 4 %.
       Full-duration class="clip" layer on track 0. Move the halo by tweening its x / y / scale / opacity only. */
    .f11-ground { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #0A0A0A; overflow: hidden; }
    .f11-halo { position: absolute; left: -60px; top: 300px; width: 1200px; height: 1200px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(251,128,0,0.16) 0%, rgba(251,128,0,0.10) 38%, rgba(251,128,0,0.035) 70%, rgba(251,128,0,0) 100%); }
    .f11-grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0.04; mix-blend-mode: screen; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
      background-size: 240px 240px; }
    /* ===================== end SHARED: ground ===================== */

    /* ===================== SHARED: title ===================== */
    /* Scene title: Big Shoulders 900, 128 px, caps, line-height 0.95, white, centred in the title zone (y 260 to 640,
       side margins 80 px). The orange title-stroke sits under the LAST line: it is sized in em, so it is always
       "line width + 20 px" (10 px each side at 128 px), 14 px tall, round cap at the left, tapered end, tilted -1.5 deg.
       Markup:
         <div class="f11-title" style="top: ...px">
           <span class="f11-tline">LINE 1</span><br>
           <span class="f11-tline">LINE 2<i class="f11-stroke-tilt"><i class="f11-stroke" id="f11-..."></i></i></span>
         </div>
       The same component scales with font-size (this frame uses it at the jumbo size, 300 px). */
    .f11-title { position: absolute; left: 80px; width: 920px; text-align: center; font: 900 128px/0.95 "Big Shoulders", sans-serif;
      text-transform: uppercase; color: #ffffff; white-space: nowrap; }
    .f11-tline { position: relative; display: inline-block; }
    .f11-stroke-tilt { position: absolute; left: -0.078em; right: -0.078em; bottom: -0.085em; height: 0.11em; display: block;
      transform: rotate(-1.5deg); transform-origin: 0 50%; }
    .f11-stroke { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #FB8000;
      border-radius: 999px; clip-path: polygon(0 0, 100% 32%, 100% 68%, 0 100%);
      transform-origin: 0 50%; transform: scaleX(0); }
    /* ===================== end SHARED: title ===================== */

    /* ===================== SHARED: subtitle ===================== */
    /* The voice, word by word, in the subtitle band (y 1260 to 1440, nothing else in it): Instrument Sans 700 58/70,
       centred on y 1350. One .f11-chunk per quoted chunk (2 to 6 words), all chunks stacked at the same place.
       Every word is a .f11-w with data-cue (frame-local s); the key word also carries .f11-key (turns #FB8000 as it
       appears, no box). data-out on the chunk = its 0.1 s leave (opacity + blur) before the next chunk. */
    .f11-sub { position: absolute; left: 0; top: 1260px; width: 1080px; height: 180px; pointer-events: none; }
    .f11-chunk { position: absolute; left: 40px; top: 55px; width: 1000px; text-align: center; white-space: nowrap;
      font: 700 58px/70px "Instrument Sans", sans-serif; color: #ffffff; text-shadow: 0 3px 18px rgba(0,0,0,0.7); }
    .f11-w { display: inline-block; opacity: 0; }
    /* ===================== end SHARED: subtitle ===================== */

    /* ---- title (the pinned anchor: outside the camera, never moves after its slam) ---- */
    #f11-title { top: 268px; transform-origin: 460px 122px; }

    /* ---- camera: push (continuous) > cran (discrete steps) > climb (rises with the wall, -30 px/s) ---- */
    .f11-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 927px; }

    /* ---- wall component: bricks 160x70, #1f1f1f with 2px #2c2c2c joints, running bond, last brick in accent ---- */
    /* 7 rows of 74 px (70 + 4 joint): rows 0,2,4 = 5 bricks, rows 1,3,5 = 4 bricks offset half a brick,
       row 6 = the keystone, alone, centred, orange. Wall box 816 x 514, centred on x 540, top y 670. */
    #f11-wall { position: absolute; left: 132px; top: 670px; width: 816px; height: 514px; transform-origin: 408px 514px; }
    .f11-brick { position: absolute; width: 160px; height: 70px; box-sizing: border-box; background: #1f1f1f;
      border: 2px solid #2c2c2c; border-radius: 4px; opacity: 0; overflow: hidden;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.04), 0 6px 14px rgba(0,0,0,0.45); }
    .f11-glow { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #FB8000; opacity: 0; }
    #f11-key { background: #FB8000; border-color: #ffb466; transform-origin: 80px 70px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.25), 0 0 34px rgba(251,128,0,0.55); }
    #f11-keyburst { position: absolute; left: 168px; top: -150px; width: 480px; height: 370px; border-radius: 50%; opacity: 0;
      background: radial-gradient(closest-side, rgba(251,128,0,0.55) 0%, rgba(251,128,0,0.22) 45%, rgba(251,128,0,0) 100%); }

    /* ---- the slash on « tranchera »: an orange diagonal across the frame, above the wall, out of the subtitle band ---- */
    #f11-slash-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }
    #f11-slash, #f11-slash-glow { fill: none; stroke-linecap: round; stroke-dasharray: 1300; stroke-dashoffset: 1300; }
    #f11-slash { stroke: #FB8000; stroke-width: 12; }
    #f11-slash-glow { stroke: #ffb466; stroke-width: 40; opacity: 0.35; }
  </style>

  <div id="root" data-composition-id="11-mur" data-width="1080" data-height="1920" data-duration="6.55">

    <!-- SHARED: ground (full-duration clip, lowest track) -->
    <div id="f11-ground" class="clip f11-ground" data-start="0" data-duration="6.55" data-track-index="0">
      <div id="f11-halo" class="f11-halo"></div>
      <div class="f11-grain"></div>
    </div>

    <!-- camera -->
    <div id="f11-push" class="f11-cam">
      <div id="f11-cran" class="f11-cam">
        <div id="f11-climb" class="f11-cam">
          <div id="f11-wall"></div>
        </div>
      </div>
    </div>

    <!-- the slash (screen-space, drawn bottom-left to top-right, stays above y 1220) -->
    <svg id="f11-slash-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <filter id="f11-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
      <path id="f11-slash-glow" d="M -20 1205 L 1100 590" filter="url(#f11-blur)"></path>
      <path id="f11-slash" d="M -20 1205 L 1100 590"></path>
    </svg>

    <!-- title: the pinned anchor -->
    <div id="f11-title" class="f11-title">
      <span class="f11-tline">BRIQUE</span><br>
      <span class="f11-tline">PAR BRIQUE<i class="f11-stroke-tilt"><i class="f11-stroke" id="f11-stroke"></i></i></span>
    </div>

    <!-- SHARED: subtitle (outside the camera: it never moves with the scene) -->
    <div id="f11-sub" class="f11-sub">
      <div class="f11-chunk" data-out="0.70"><span class="f11-w" data-cue="0.16">Ça</span> <span class="f11-w" data-cue="0.28">prend</span> <span class="f11-w" data-cue="0.39">du</span> <span class="f11-w f11-key" data-cue="0.51">temps</span></div>
      <div class="f11-chunk" data-out="1.96"><span class="f11-w" data-cue="0.81">et</span> <span class="f11-w" data-cue="0.85">de</span> <span class="f11-w" data-cue="0.98">la</span> <span class="f11-w" data-cue="1.12">régularité.</span></div>
      <div class="f11-chunk" data-out="3.08"><span class="f11-w" data-cue="2.10">Mais</span> <span class="f11-w" data-cue="2.25">une</span> <span class="f11-w" data-cue="2.40">fois</span> <span class="f11-w" data-cue="2.55">en</span> <span class="f11-w" data-cue="2.71">place,</span></div>
      <div class="f11-chunk" data-out="4.22"><span class="f11-w" data-cue="3.23">personne</span> <span class="f11-w" data-cue="3.45">ne</span> <span class="f11-w" data-cue="3.56">te</span> <span class="f11-w" data-cue="3.66">le</span> <span class="f11-w f11-key" data-cue="3.77">prend.</span></div>
      <div class="f11-chunk" data-out="5.30"><span class="f11-w" data-cue="4.37">Pas</span> <span class="f11-w" data-cue="4.48">le</span> <span class="f11-w" data-cue="4.59">temps</span> <span class="f11-w" data-cue="4.70">d'être</span> <span class="f11-w" data-cue="4.82">régulier&nbsp;?</span></div>
      <div class="f11-chunk"><span class="f11-w" data-cue="5.45">Le</span> <span class="f11-w" data-cue="5.57">marché</span> <span class="f11-w f11-key" data-cue="5.81">tranchera</span> <span class="f11-w" data-cue="6.17">pour</span> <span class="f11-w" data-cue="6.29">toi.</span></div>
    </div>

  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "11-mur";
      var DUR = 6.55;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + id); }
      var tl = gsap.timeline({ paused: true });

      /* ===================== SHARED: title (JS) ===================== */
      // Title slam: scale 1.25 -> 1, blur 10 -> 0, 0.18 s expo.out (t0 > 0: the element starts at opacity 0 in CSS).
      function f11TitleIn(tl, el, t0) {
        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, t0);
      }
      // Orange stroke: draws from the left, scaleX 0 -> 1, 0.3 s power3.out.
      function f11StrokeDraw(tl, el, t0) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
      }
      /* ===================== end SHARED: title (JS) ===================== */

      /* ===================== SHARED: subtitle (JS) ===================== */
      // Each word appears 1 frame before its cue (never late): opacity 0 -> 1, y 14 -> 0, blur 6 -> 0 in 0.12 s.
      // The key word turns #FB8000 as it appears. A chunk leaves at its data-out in 0.1 s (opacity + blur).
      var F11_LEAD = 1 / 30;
      function f11Subtitle(tl, box) {
        Array.prototype.forEach.call(box.querySelectorAll(".f11-chunk"), function (ch) {
          Array.prototype.forEach.call(ch.querySelectorAll(".f11-w"), function (w) {
            var t = Math.max(0, parseFloat(w.getAttribute("data-cue")) - F11_LEAD);
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            if (w.classList.contains("f11-key")) {
              tl.fromTo(w, { color: "#ffffff" }, { color: "#FB8000", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            }
          });
          var out = ch.getAttribute("data-out");
          if (out) {
            tl.fromTo(ch, { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power3.out", immediateRender: false }, parseFloat(out));
          }
        });
      }
      /* ===================== end SHARED: subtitle (JS) ===================== */

      /* ---- build the wall (deterministic layout, bottom row first) ---- */
      var wall = $("f11-wall");
      var ROWS = [5, 4, 5, 4, 5, 4];          // grey rows, bottom -> top
      var PITCH_X = 164, PITCH_Y = 74, H = 514;
      var bricks = [];                         // { el, glow, row, col }
      ROWS.forEach(function (n, r) {
        var x0 = (n === 4) ? 82 : 0;
        var top = H - 70 - r * PITCH_Y;
        for (var c = 0; c < n; c++) {
          var b = document.createElement("div");
          b.className = "f11-brick";
          b.id = "f11-b" + r + "-" + c;
          b.style.left = (x0 + c * PITCH_X) + "px";
          b.style.top = top + "px";
          var g = document.createElement("div");
          g.className = "f11-glow";
          b.appendChild(g);
          wall.appendChild(b);
          bricks.push({ el: b, glow: g, row: r, col: c, n: n });
        }
      });
      // keystone glow burst (behind) + the orange keystone, row 6, centred
      var burst = document.createElement("div");
      burst.id = "f11-keyburst";
      wall.insertBefore(burst, wall.firstChild);
      var key = document.createElement("div");
      key.id = "f11-key";
      key.className = "f11-brick";
      key.style.left = (2 * PITCH_X) + "px";
      key.style.top = "0px";
      wall.appendChild(key);

      /* ---- camera track ---- */
      // climb: rises with the wall at -30 px/s until the cran (then the push carries the motion)
      tl.fromTo($("f11-climb"), { y: 50 }, { y: 50 - 30 * 3.70, duration: 3.70, ease: "none" }, 0);
      // cran 3.70: a step in, just before the keystone lands
      tl.fromTo($("f11-cran"), { scale: 1 }, { scale: 1.03, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.70);
      // kick 5.81 on « tranchera »
      tl.fromTo($("f11-cran"), { scale: 1.03 }, { scale: 1.042, duration: 0.3, ease: "expo.out", immediateRender: false }, 5.81);
      // push +0.8 %/s over the whole frame
      tl.fromTo($("f11-push"), { scale: 1 }, { scale: 1 + 0.008 * DUR, duration: DUR, ease: "none" }, 0);
      // the halo follows the climb
      tl.fromTo($("f11-halo"), { y: 40 }, { y: 40 - 30 * 3.70, duration: 3.70, ease: "none" }, 0);

      /* ---- 0.00 title slams (present from frame 1), 0.30 its stroke draws ---- */
      tl.fromTo($("f11-title"), { opacity: 1, scale: 1.25, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, 0);
      f11StrokeDraw(tl, $("f11-stroke"), 0.30);

      /* ---- 0.40 -> 3.52: bricks land bottom-up, one every 0.12 s (waterfall: binary opacity, whip down) ---- */
      var T0 = 0.40, STEP = 0.12;
      bricks.forEach(function (b, i) {
        var t = T0 + i * STEP;
        tl.fromTo(b.el, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, t);
        tl.fromTo(b.el, { y: -54, scale: 1.08 }, { y: 0, scale: 1, duration: 0.17, ease: "expo.out", immediateRender: false }, t);
        // row completes: the whole wall settles a hair (soft pop)
        if (b.col === b.n - 1) {
          tl.fromTo(wall, { y: 0 }, { y: 3, duration: 0.06, ease: "power3.out", immediateRender: false }, t + 0.12);
          tl.fromTo(wall, { y: 3 }, { y: 0, duration: 0.16, ease: "power3.out", immediateRender: false }, t + 0.18);
        }
      });

      /* ---- 3.77 « prend »: the orange keystone slams on top ---- */
      tl.fromTo(key, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 3.72);
      tl.fromTo(key, { y: -220, scale: 1.45, filter: "blur(10px)" },
        { y: 0, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out", immediateRender: false }, 3.72);
      tl.fromTo(wall, { y: 0 }, { y: 8, duration: 0.05, ease: "power3.out", immediateRender: false }, 3.86);
      tl.fromTo(wall, { y: 8 }, { y: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, 3.91);
      tl.fromTo(burst, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.15, duration: 0.22, ease: "expo.out", immediateRender: false }, 3.86);
      tl.fromTo(burst, { opacity: 1, scale: 1.15 }, { opacity: 0.5, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 4.10);
      tl.fromTo($("f11-halo"), { scale: 1, opacity: 1 }, { scale: 1.12, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 3.86);

      /* ---- 4.37 -> 5.40: an orange glow runs up the wall, row by row ---- */
      bricks.forEach(function (b) {
        var t = 4.37 + b.row * 0.13 + b.col * 0.035;
        tl.fromTo(b.glow, { opacity: 0 }, { opacity: 0.34, duration: 0.16, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo(b.glow, { opacity: 0.34 }, { opacity: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, t + 0.16);
      });
      tl.fromTo(burst, { opacity: 0.5 }, { opacity: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 5.15);

      /* ---- 5.81 « tranchera »: the slash cuts the frame, the wall lights up ---- */
      var slash = $("f11-slash"), slashGlow = $("f11-slash-glow");
      var len = 1300;
      try { len = Math.ceil(slash.getTotalLength()) + 2; } catch (e) {}
      [slash, slashGlow].forEach(function (p) { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; });
      tl.fromTo(slashGlow, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.2, ease: "expo.out", immediateRender: false }, 5.78);
      tl.fromTo(slash, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.2, ease: "expo.out", immediateRender: false }, 5.78);
      bricks.forEach(function (b) {
        var t = 5.86 + (5 - b.row) * 0.025;
        tl.fromTo(b.glow, { opacity: 0 }, { opacity: 0.2, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
      });
      tl.fromTo($("f11-halo"), { scale: 1.12 }, { scale: 1.3, duration: 0.5, ease: "power3.out", immediateRender: false }, 5.86);

      /* ---- the voice, word by word ---- */
      f11Subtitle(tl, $("f11-sub"));

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
