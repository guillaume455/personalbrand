<template>
  <style>
    @font-face { font-family: "Big Shoulders"; src: url("assets/fonts/Anton-400.woff2") format("woff2"); font-weight: 900; }
    @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-700.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-600.woff2") format("woff2"); font-weight: 600; }

    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #ffffff;
      font-family: "Instrument Sans", sans-serif; -webkit-font-smoothing: antialiased; }

    /* ===================== SHARED: ground ===================== */
    /* solid #0A0A0A + one soft accent halo behind the focal element + static grain 4 %.
       Full-duration class="clip" layer on track 0. Move the halo by tweening its x / y / scale / opacity only. */
    .f05-ground { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #0A0A0A; overflow: hidden; }
    .f05-halo { position: absolute; left: -60px; top: 300px; width: 1200px; height: 1200px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(251,128,0,0.16) 0%, rgba(251,128,0,0.10) 38%, rgba(251,128,0,0.035) 70%, rgba(251,128,0,0) 100%); }
    .f05-grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0.04; mix-blend-mode: screen; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
      background-size: 240px 240px; }
    /* ===================== end SHARED: ground ===================== */

    /* ===================== SHARED: title ===================== */
    /* Scene title: Big Shoulders 900, 128 px, caps, line-height 0.95, white, centred in the title zone (y 260 to 640,
       side margins 80 px). The orange title-stroke sits under the LAST line: it is sized in em, so it is always
       "line width + 20 px" (10 px each side at 128 px), 14 px tall, round cap at the left, tapered end, tilted -1.5 deg.
       Markup:
         <div class="f05-title" style="top: ...px">
           <span class="f05-tline">LINE 1</span><br>
           <span class="f05-tline">LINE 2<i class="f05-stroke-tilt"><i class="f05-stroke" id="f05-..."></i></i></span>
         </div>
       The same component scales with font-size (this frame uses it at the jumbo size, 300 px). */
    .f05-title { position: absolute; left: 80px; width: 920px; text-align: center; font: 900 128px/1.2 "Big Shoulders", sans-serif;
      text-transform: uppercase; color: #ffffff; white-space: nowrap; }
    .f05-tline { position: relative; display: inline-block; }
    .f05-stroke-tilt { position: absolute; left: -0.078em; right: -0.078em; bottom: -0.085em; height: 0.11em; display: block;
      transform: rotate(-1.5deg); transform-origin: 0 50%; }
    .f05-stroke { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #FB8000;
      border-radius: 999px; clip-path: polygon(0 0, 100% 32%, 100% 68%, 0 100%);
      transform-origin: 0 50%; transform: scaleX(0); }
    /* ===================== end SHARED: title ===================== */

    /* ===================== SHARED: subtitle ===================== */
    /* The voice, word by word, in the subtitle band (y 1260 to 1440, nothing else in it): Instrument Sans 700 58/70,
       centred on y 1350. One .f05-chunk per quoted chunk (2 to 6 words), all chunks stacked at the same place.
       Every word is a .f05-w with data-cue (frame-local s); the key word also carries .f05-key (turns #FB8000 as it
       appears, no box). data-out on the chunk = its 0.1 s leave (opacity + blur) before the next chunk. */
    .f05-sub { position: absolute; left: 0; top: 1260px; width: 1080px; height: 180px; pointer-events: none; }
    .f05-chunk { position: absolute; left: 40px; top: 55px; width: 1000px; text-align: center; white-space: nowrap;
      font: 700 58px/70px "Instrument Sans", sans-serif; color: #ffffff; text-shadow: 0 3px 18px rgba(0,0,0,0.7); }
    .f05-w { display: inline-block; opacity: 0; }
    /* ===================== end SHARED: subtitle ===================== */

    /* ---- camera: push (scene 1 pull-back 1.3 -> 0.8) > drift (scene 2: up -20 px/s, +1 %/s) > cran (discrete steps) ---- */
    .f05-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 820px; }

    /* ---- the mosaic: origin point at (540, 820); every tile is centred on it, placed by GSAP x / y ---- */
    #f05-mosaic { position: absolute; left: 540px; top: 820px; width: 0; height: 0; }

    /* ---- listing-tile: white card 300x380, radius 18, lbc header, photo, title, green price ---- */
    .f05-tile { position: absolute; left: -150px; top: -190px; width: 300px; height: 380px; border-radius: 18px; overflow: hidden;
      background: #ffffff; opacity: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.45); }
    .f05-tile-head { position: absolute; left: 0; top: 0; width: 300px; height: 40px; background: #ffffff; }
    .f05-tile-logo { position: absolute; left: 14px; top: 11px; width: 72px; height: 18px; }
    .f05-tile-photo { position: absolute; left: 0; top: 40px; width: 300px; height: 228px; object-fit: cover; object-position: 50% 0%; }
    .f05-tile-name { position: absolute; left: 16px; top: 282px; width: 270px; white-space: nowrap;
      font: 600 27px/32px "Instrument Sans", sans-serif; color: #111111; }
    .f05-tile-price { position: absolute; left: 16px; top: 322px; width: 270px; white-space: nowrap;
      font: 700 30px/36px "Instrument Sans", sans-serif; color: #1d6b43; }

    /* ---- darkening of the mosaic (35 % brightness), its flash, the bottom fade that keeps the subtitle band clean ---- */
    #f05-dim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #0A0A0A; opacity: 0; }
    #f05-fade { position: absolute; left: 0; top: 1040px; width: 1080px; height: 880px;
      background: linear-gradient(to bottom, rgba(10,10,10,0) 0%, rgba(10,10,10,0.88) 22%, #0A0A0A 30%, #0A0A0A 100%); }

    /* ---- the dark band under the title ---- */
    #f05-band { position: absolute; left: 0; top: 236px; width: 1080px; height: 470px; background: rgba(10,10,10,0.9);
      border-top: 2px solid #1f1f1f; border-bottom: 2px solid #1f1f1f; opacity: 0; transform-origin: 540px 235px; }
    #f05-title { top: 300px; font-size: 104px; }
    #f05-title .f05-tline { opacity: 0; }
  </style>

  <div id="root" data-composition-id="05-mosaique" data-width="1080" data-height="1920" data-duration="5.83">

    <!-- SHARED: ground (full-duration clip, lowest track) -->
    <div id="f05-ground" class="clip f05-ground" data-start="0" data-duration="5.83" data-track-index="0">
      <div id="f05-halo" class="f05-halo"></div>
      <div class="f05-grain"></div>
    </div>

    <!-- camera > mosaic of identical listing tiles (36 copies, built below) -->
    <div id="f05-push" class="f05-cam">
      <div id="f05-drift" class="f05-cam">
        <div id="f05-cran" class="f05-cam">
          <div id="f05-mosaic"></div>
        </div>
      </div>
    </div>

    <div id="f05-dim"></div>
    <div id="f05-fade"></div>

    <!-- the title on its dark band -->
    <div id="f05-band"></div>
    <div id="f05-title" class="f05-title">
      <span id="f05-t1" class="f05-tline">TOUT LE MONDE PÊCHE</span><br>
      <span id="f05-t2" class="f05-tline">AU MÊME</span><br>
      <span id="f05-t3" class="f05-tline">ENDROIT<i class="f05-stroke-tilt"><i class="f05-stroke" id="f05-stroke"></i></i></span>
    </div>

    <!-- SHARED: subtitle (outside the camera: it never moves with the scene) -->
    <div id="f05-sub" class="f05-sub">
      <div class="f05-chunk" data-out="0.95"><span class="f05-w" data-cue="0.27">Le</span> <span class="f05-w" data-cue="0.44">vrai</span> <span class="f05-w f05-key" data-cue="0.60">problème,</span></div>
      <div class="f05-chunk" data-out="1.92"><span class="f05-w" data-cue="1.10">c'est</span> <span class="f05-w" data-cue="1.26">pas</span> <span class="f05-w" data-cue="1.43">la</span> <span class="f05-w" data-cue="1.59">loi.</span></div>
      <div class="f05-chunk" data-out="2.75"><span class="f05-w" data-cue="2.06">Si</span> <span class="f05-w" data-cue="2.22">tu</span> <span class="f05-w f05-key" data-cue="2.38">pêches</span> <span class="f05-w" data-cue="2.54">là</span> <span class="f05-w" data-cue="2.70">où</span></div>
      <div class="f05-chunk" data-out="4.02"><span class="f05-w" data-cue="2.86">pêchent</span> <span class="f05-w" data-cue="3.17">tous</span> <span class="f05-w" data-cue="3.33">tes</span> <span class="f05-w" data-cue="3.49">concurrents,</span></div>
      <div class="f05-chunk" data-out="4.72"><span class="f05-w" data-cue="4.16">c'est</span> <span class="f05-w" data-cue="4.30">normal</span> <span class="f05-w" data-cue="4.57">d'avoir</span></div>
      <div class="f05-chunk"><span class="f05-w" data-cue="4.85">de</span> <span class="f05-w" data-cue="4.99">la</span> <span class="f05-w f05-key" data-cue="5.13">concurrence.</span></div>
    </div>

  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "05-mosaique";
      var DUR = 5.83;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + id); }
      var tl = gsap.timeline({ paused: true });

      /* ===================== SHARED: title (JS) ===================== */
      // Title slam: scale 1.25 -> 1, blur 10 -> 0, 0.18 s expo.out (t0 > 0: the element starts at opacity 0 in CSS).
      function f05TitleIn(tl, el, t0) {
        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, t0);
      }
      // Orange stroke: draws from the left, scaleX 0 -> 1, 0.3 s power3.out.
      function f05StrokeDraw(tl, el, t0) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
      }
      /* ===================== end SHARED: title (JS) ===================== */

      /* ===================== SHARED: subtitle (JS) ===================== */
      // Each word appears 1 frame before its cue (never late): opacity 0 -> 1, y 14 -> 0, blur 6 -> 0 in 0.12 s.
      // The key word turns #FB8000 as it appears. A chunk leaves at its data-out in 0.1 s (opacity + blur).
      var F05_LEAD = 1 / 30;
      function f05Subtitle(tl, box) {
        Array.prototype.forEach.call(box.querySelectorAll(".f05-chunk"), function (ch) {
          Array.prototype.forEach.call(ch.querySelectorAll(".f05-w"), function (w) {
            var t = Math.max(0, parseFloat(w.getAttribute("data-cue")) - F05_LEAD);
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            if (w.classList.contains("f05-key")) {
              tl.fromTo(w, { color: "#ffffff" }, { color: "#FB8000", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            }
          });
          var out = ch.getAttribute("data-out");
          if (out) {
            tl.fromTo(ch, { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power3.out", immediateRender: false }, parseFloat(out));
          }
        });
      }
      /* ===================== end SHARED: subtitle (JS) ===================== */

      /* ---- build the 36 identical listing tiles (one tile, copied) ---- */
      var N = 36;
      var mosaic = $("f05-mosaic");
      var tiles = [];
      for (var i = 0; i < N; i++) {
        var t = document.createElement("div");
        t.className = "f05-tile";
        t.id = "f05-tile-" + i;
        t.innerHTML =
          '<div class="f05-tile-head"><img class="f05-tile-logo" src="assets/img/lbc-logo.png" alt=""></div>' +
          '<img class="f05-tile-photo" src="assets/img/thumb-audi.png" alt="">' +
          '<div class="f05-tile-name">Audi RS Q8</div>' +
          '<div class="f05-tile-price">86 900 €</div>';
        mosaic.appendChild(t);
        tiles.push(t);
      }

      /* ---- grid layouts: slots sorted from the centre outwards, so tile i keeps the i-th most central slot ---- */
      function layout(cols, rows, px, py) {
        var s = [];
        for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
          var x = (c - (cols - 1) / 2) * px, y = (r - (rows - 1) / 2) * py;
          s.push({ x: x, y: y, d: Math.round(Math.sqrt(x * x + y * y)), a: Math.atan2(y, x) });
        }
        s.sort(function (p, q) { return p.d - q.d || p.a - q.a; });
        return s;
      }
      var PX = 324, PY = 404;
      var stages = [
        { t: 0.10, s: layout(1, 1, PX, PY), blur: true },
        { t: 0.60, s: layout(2, 1, PX, PY), blur: true },
        { t: 1.00, s: layout(2, 2, PX, PY), blur: true },
        { t: 1.40, s: layout(3, 3, PX, PY), blur: true },
        { t: 1.80, s: layout(4, 4, PX, PY), blur: true },
        { t: 2.06, s: layout(6, 6, PX, PY), blur: false }
      ];
      // existing tiles take the nearest free slot (no crossings); new copies fill the rest, centre outwards
      function assign(prevSlots, slots) {
        var used = [], out = [];
        prevSlots.forEach(function (p) {
          var best = -1, bd = 1e9;
          slots.forEach(function (q, j) {
            if (used[j]) return;
            var d = (q.x - p.x) * (q.x - p.x) + (q.y - p.y) * (q.y - p.y);
            if (d < bd - 0.5) { bd = d; best = j; }
          });
          used[best] = true; out.push(slots[best]);
        });
        slots.forEach(function (q, j) { if (!used[j]) out.push(q); });
        return out;
      }
      var prev = [];
      stages.forEach(function (st) {
        st.s = assign(prev, st.s);
        st.s.forEach(function (slot, i) {
          var el = tiles[i];
          if (i < prev.length) {
            // an existing tile slides to its new slot
            tl.fromTo(el, { x: prev[i].x, y: prev[i].y }, { x: slot.x, y: slot.y, duration: 0.32, ease: "expo.out", immediateRender: false }, st.t);
          } else {
            // a new copy lands on its slot: x1.2, blurred -> sharp (scene 1); scale + opacity only for the 36 (no blur)
            var t0 = st.t + Math.min(0.12, (i - prev.length) * (st.blur ? 0.025 : 0.006));
            if (st.blur) {
              tl.fromTo(el, { x: slot.x, y: slot.y, opacity: 0, scale: 1.2, filter: "blur(10px)" },
                { x: slot.x, y: slot.y, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out", immediateRender: false }, t0);
              tl.set(el, { filter: "none" }, t0 + 0.23);
            } else {
              tl.fromTo(el, { x: slot.x, y: slot.y, opacity: 0, scale: 1.2 },
                { x: slot.x, y: slot.y, opacity: 1, scale: 1, duration: 0.24, ease: "expo.out", immediateRender: false }, t0);
            }
          }
        });
        prev = st.s;
      });

      /* ---- camera track ---- */
      // Scene 1: continuous pull-back 1.3 -> 0.8 to discover the mosaic
      tl.fromTo($("f05-push"), { scale: 1.3 }, { scale: 0.8, duration: 2.06, ease: "power1.out" }, 0);
      // Scene 2: slow drift up (-20 px/s) + push +1 %/s, to the cut
      tl.fromTo($("f05-drift"), { y: 0, scale: 1 }, { y: -20 * (DUR - 2.06), scale: 1 + 0.01 * (DUR - 2.06), duration: DUR - 2.06, ease: "none", immediateRender: false }, 2.06);
      // 4.00 a short step in on the mass of tiles
      tl.fromTo($("f05-cran"), { scale: 1 }, { scale: 1.03, duration: 0.3, ease: "power3.out", immediateRender: false }, 4.00);

      /* ---- Scene 2 (2.06 -> 5.83): the same pond ---- */
      // 2.06 the mosaic darkens to 35 % brightness
      var dim = $("f05-dim");
      tl.fromTo(dim, { opacity: 0 }, { opacity: 0.65, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.06);
      // 2.28 the dark band opens behind the title zone
      tl.fromTo($("f05-band"), { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 2.28);
      // 2.38 on « pêches » the title slams line by line (0.15 s apart, each its own axis)
      f05TitleIn(tl, $("f05-t1"), 2.38);
      tl.fromTo($("f05-t2"), { opacity: 0, y: 70, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 2.53);
      tl.fromTo($("f05-t3"), { opacity: 0, scale: 1.45, filter: "blur(12px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 2.68);
      // 2.90 the orange stroke
      f05StrokeDraw(tl, $("f05-stroke"), 2.90);
      // 3.49 on « concurrents » every tile flashes at once
      tl.fromTo(dim, { opacity: 0.65 }, { opacity: 0.08, duration: 0.06, ease: "power3.out", immediateRender: false }, 3.46);
      tl.fromTo(dim, { opacity: 0.08 }, { opacity: 0.65, duration: 0.34, ease: "power3.out", immediateRender: false }, 3.56);
      // 4.30 on « normal » a ripple runs through the tiles from the centre (scale pulse)
      var s6 = stages[5].s;
      tiles.forEach(function (el, i) {
        var d = Math.min(0.3, s6[i].d / 1600 * 0.3);
        tl.fromTo(el, { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power3.out", immediateRender: false }, 4.27 + d);
        tl.fromTo(el, { scale: 1.06 }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 4.39 + d);
      });
      // 5.13 on « concurrence » the mosaic tightens one notch (gaps close, camera a step back)
      tiles.forEach(function (el, i) {
        tl.fromTo(el, { x: s6[i].x, y: s6[i].y }, { x: s6[i].x * 306 / PX, y: s6[i].y * 386 / PY, duration: 0.3, ease: "expo.out", immediateRender: false }, 5.13);
      });
      tl.fromTo($("f05-cran"), { scale: 1.03 }, { scale: 0.97, duration: 0.3, ease: "expo.out", immediateRender: false }, 5.13);
      // halo: swells under the first tile, then follows the mosaic
      tl.fromTo($("f05-halo"), { scale: 0.8, opacity: 0.6 }, { scale: 1.15, opacity: 1, duration: 1.8, ease: "power3.out" }, 0);

      /* ---- the voice, word by word ---- */
      f05Subtitle(tl, $("f05-sub"));

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
