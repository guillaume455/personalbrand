    /* ===================== SHARED: ground ===================== */
    /* solid #0A0A0A + one soft accent halo behind the focal element + static grain 4 %.
       Full-duration class="clip" layer on track 0. Move the halo by tweening its x / y / scale / opacity only. */
    .f13-ground { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #0A0A0A; overflow: hidden; }

      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");

       Markup:
         <div class="f13-title" style="top: ...px">
           <span class="f13-tline">LINE 1</span><br>
           <span class="f13-tline">LINE 2<i class="f13-stroke-tilt"><i class="f13-stroke" id="f13-..."></i></i></span>
         </div>
       The same component scales with font-size (this frame uses it at the jumbo size, 300 px). */
    .f13-title { position: absolute; left: 80px; width: 920px; text-align: center; font: 900 128px/0.95 "Big Shoulders", sans-serif;

    /* ===================== SHARED: subtitle ===================== */
    /* The voice, word by word, in the subtitle band (y 1260 to 1440, nothing else in it): Instrument Sans 700 58/70,
       centred on y 1350. One .f13-chunk per quoted chunk (2 to 6 words), all chunks stacked at the same place.
       Every word is a .f13-w with data-cue (frame-local s); the key word also carries .f13-key (turns #FB8000 as it
       appears, no box). data-out on the chunk = its 0.1 s leave (opacity + blur) before the next chunk. */
    .f13-sub { position: absolute; left: 0; top: 1260px; width: 1080px; height: 180px; pointer-events: none; }
    .f13-chunk { position: absolute; left: 40px; top: 55px; width: 1000px; text-align: center; white-space: nowrap;

    .f13-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 900px; }

    /* ---- OLD (end image of 12-louer, leaves upward in 0.2 s) ---- */

    #f13-t1 { top: 430px; font-size: 118px; opacity: 0; transform-origin: 460px 56px; }

    #f13-face-a { background: #FB8000; color: #111111; }

      stroke-dasharray: 60; stroke-dashoffset: 60; }
    .f13-sheen { position: absolute; left: -160px; top: -20px; width: 90px; height: 164px; opacity: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-20deg); }

    /* ---- cursor: fingertip circle + ripple rings at the button centre ---- */
    .f13-ripple { position: absolute; left: 490px; top: 1022px; width: 100px; height: 100px; border-radius: 50%;
      border: 4px solid #FB8000; box-sizing: border-box; opacity: 0; transform: scale(0); pointer-events: none; }
    #f13-cur { position: absolute; left: 548px; top: 1058px; width: 84px; height: 84px; opacity: 0; pointer-events: none;
      transform-origin: 42px 42px; }
    #f13-cur-dot { position: absolute; left: 0; top: 0; width: 84px; height: 84px; border-radius: 50%;

      box-shadow: 0 8px 28px rgba(0,0,0,0.55), 0 0 0 10px rgba(255,255,255,0.12); }
  </style>

  <script>
    (function () {
      var FID = "13-posseder";
      var DUR = 4.40;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + id); }
      var tl = gsap.timeline({ paused: true });

      /* ===================== SHARED: title (JS) ===================== */
      // Title slam: scale 1.25 -> 1, blur 10 -> 0, 0.18 s expo.out (t0 > 0: the element starts at opacity 0 in CSS).
      function f13TitleIn(tl, el, t0) {
        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, t0);
      }
      // Orange stroke: draws from the left, scaleX 0 -> 1, 0.3 s power3.out.
      function f13StrokeDraw(tl, el, t0) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
      }
      /* ===================== end SHARED: title (JS) ===================== */

      /* ===================== SHARED: subtitle (JS) ===================== */
      // Each word appears 1 frame before its cue (never late): opacity 0 -> 1, y 14 -> 0, blur 6 -> 0 in 0.12 s.
      // The key word turns #FB8000 as it appears. A chunk leaves at its data-out in 0.1 s (opacity + blur).
      var F13_LEAD = 1 / 30;
      function f13Subtitle(tl, box) {
        Array.prototype.forEach.call(box.querySelectorAll(".f13-chunk"), function (ch) {
          Array.prototype.forEach.call(ch.querySelectorAll(".f13-w"), function (w) {
            var t = Math.max(0, parseFloat(w.getAttribute("data-cue")) - F13_LEAD);
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            if (w.classList.contains("f13-key")) {
              tl.fromTo(w, { color: "#ffffff" }, { color: "#FB8000", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            }
          });
          var out = ch.getAttribute("data-out");
          if (out) {
            tl.fromTo(ch, { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power3.out", immediateRender: false }, parseFloat(out));
          }
        });
      }
      /* ===================== end SHARED: subtitle (JS) ===================== */

      /* ---- camera track ---- */
      // continues 12-louer's push (+1 %/s): its 3.92 value is our 0.00 value
      var PUSH0 = 1 + 0.01 * 3.92;
      tl.fromTo($("f13-push"), { scale: PUSH0 }, { scale: PUSH0 + 0.01 * DUR, duration: DUR, ease: "none" }, 0);
      // cran 1.80: a step in as the scene turns to the subscription
      tl.fromTo($("f13-cran"), { scale: 1, y: 0 }, { scale: 1.015, y: -10, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.80);
      // cran 3.00: a small punch on the tap
      tl.fromTo($("f13-cran"), { scale: 1.015 }, { scale: 1.025, duration: 0.3, ease: "expo.out", immediateRender: false }, 3.00);

      /* ---- Scene 1 (0.00 -> 1.80): ces canaux, tu les possèdes ---- */
      // 0.00 the 12-louer title, phone and counter leave upward (0.2 s)
      tl.fromTo($("f13-old"), { y: 0, opacity: 1, filter: "blur(0px)" },
        { y: -260, opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 0);
      // 0.15 « CES CANAUX : » slams
      f13TitleIn(tl, $("f13-t1"), 0.15);
      // the three icons land above it, 0.08 s apart (drop + sharpen)
      ["f13-ico1", "f13-ico2", "f13-ico3"].forEach(function (id, i) {
        tl.fromTo($(id), { opacity: 0, y: -40, scale: 0.7, filter: "blur(6px)" },
          { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out", immediateRender: false }, 0.27 + 0.08 * i);
      });
      // 0.55 the halo rises behind the title
      tl.fromTo($("f13-halo"), { y: 0, scale: 1 }, { y: -320, scale: 0.9, duration: 0.6, ease: "power3.out", immediateRender: false }, 0.55);
      // 1.16 on « possèdes » « TU LES POSSÈDES. » slams (rises from below, distinct from line 1)
      tl.fromTo($("f13-t2"), { opacity: 0, y: 70, scale: 1.18, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 1.16);
      // 1.30 the stroke draws
      f13StrokeDraw(tl, $("f13-stroke"), 1.30);
      // 1.50 the icons turn accent, one after the other (they are « possédés »)
      ["f13-ico1", "f13-ico2", "f13-ico3"].forEach(function (id, i) {
        var a = $(id).querySelector(".f13-ico-a");
        tl.fromTo(a, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power3.out", immediateRender: false }, 1.50 + 0.06 * i);
        tl.fromTo($(id), { scale: 1 }, { scale: 1.12, duration: 0.1, ease: "power3.out", immediateRender: false }, 1.50 + 0.06 * i);
        tl.fromTo($(id), { scale: 1.12 }, { scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, 1.60 + 0.06 * i);
      });

      /* ---- Scene 2 (1.80 -> 4.40): the subscription ---- */
      // 1.85 the handle arrives (x1.2 blur -> sharp)
      tl.fromTo($("f13-handle"), { opacity: 0, scale: 1.2, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 1.85);
      // the halo slides down behind the handle / button
      tl.fromTo($("f13-halo"), { y: -320, scale: 0.9 }, { y: 80, scale: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, 1.85);
      // 2.10 the button settles underneath
      tl.fromTo($("f13-btn"), { opacity: 0, y: 50, scale: 0.86 },
        { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "expo.out", immediateRender: false }, 2.10);
      // 2.35 its glow blooms
      tl.fromTo($("f13-glow"), { opacity: 0, scale: 0.7 }, { opacity: 0.8, scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.35);
      // 2.55 -> 2.95 the fingertip arrives in one curve (x and y on different eases), tap at 3.00
      tl.fromTo($("f13-cur"), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power3.out", immediateRender: false }, 2.55);
      tl.fromTo($("f13-cur"), { x: -520 }, { x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 2.55);
      tl.fromTo($("f13-cur"), { y: 560 }, { y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, 2.55);
      // 3.00 press: fingertip and button compress together, then release
      tl.fromTo($("f13-cur"), { scale: 1 }, { scale: 0.84, duration: 0.08, ease: "power2.in", immediateRender: false }, 3.00);
      tl.fromTo($("f13-cur"), { scale: 0.84 }, { scale: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, 3.08);
      tl.fromTo($("f13-btn"), { scale: 1 }, { scale: 0.94, duration: 0.08, ease: "power2.in", immediateRender: false }, 3.00);
      tl.fromTo($("f13-btn"), { scale: 0.94 }, { scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 3.08);
      // ripple rings from the button centre
      tl.fromTo($("f13-rip1"), { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 5.2, duration: 0.7, ease: "power2.out", immediateRender: false }, 3.04);
      tl.fromTo($("f13-rip2"), { opacity: 0.7, scale: 0.4 }, { opacity: 0, scale: 4.2, duration: 0.7, ease: "power2.out", immediateRender: false }, 3.13);
      // 3.06 « S'ABONNER » -> « ABONNÉ ✓ »
      tl.fromTo($("f13-face-a"), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power3.out", immediateRender: false }, 3.06);
      tl.fromTo($("f13-face-b"), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out", immediateRender: false }, 3.06);
      tl.fromTo($("f13-check").querySelector("path"), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 3.14);
      tl.fromTo($("f13-glow"), { opacity: 0.8, scale: 1 }, { opacity: 1, scale: 1.18, duration: 0.4, ease: "power3.out", immediateRender: false }, 3.06);

      /* ---- 3.20 -> 4.40: living hold ---- */
      // 3.30 the fingertip lifts away down-left
      tl.fromTo($("f13-cur"), { x: 0, y: 0, opacity: 1 }, { x: -180, y: 200, opacity: 0, duration: 0.35, ease: "power3.in", immediateRender: false }, 3.30);
      // the halo glides slowly across behind the button
      tl.fromTo($("f13-halo"), { x: 0 }, { x: 70, duration: 1.2, ease: "sine.inOut", immediateRender: false }, 3.20);
      // 3.55 and 4.05 a sheen sweeps across the « ABONNÉ ✓ » button
      tl.fromTo($("f13-sheen-b"), { x: 0, opacity: 1 }, { x: 680, opacity: 1, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 3.55);
      tl.fromTo($("f13-sheen-b"), { x: 0 }, { x: 680, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 4.05);
      // 3.80 the glow breathes, the icons pulse once in turn
      tl.fromTo($("f13-glow"), { scale: 1.18 }, { scale: 1.05, duration: 0.6, ease: "sine.inOut", immediateRender: false }, 3.80);
      ["f13-ico1", "f13-ico2", "f13-ico3"].forEach(function (id, i) {
        tl.fromTo($(id), { y: 0 }, { y: -10, duration: 0.15, ease: "power3.out", immediateRender: false }, 3.75 + 0.1 * i);
        tl.fromTo($(id), { y: -10 }, { y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 3.90 + 0.1 * i);
      });

      /* ---- the voice, word by word ---- */
      f13Subtitle(tl, $("f13-sub"));

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
