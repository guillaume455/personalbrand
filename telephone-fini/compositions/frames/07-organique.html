            <svg class="f07-eye" viewBox="0 0 44 44"><path d="M3 22 C 9 12, 15 8, 22 8 C 29 8, 35 12, 41 22 C 35 32, 29 36, 22 36 C 15 36, 9 32, 3 22 Z" fill="none" stroke="#FB8000" stroke-width="3.6" stroke-linejoin="round"></path><circle cx="22" cy="22" r="6.5" fill="#FB8000"></circle></svg>
            <div class="f07-vues">VUES</div>
            <div id="f07-num-box" class="f07-num-box"><div id="f07-num" class="f07-num"><span>9 800</span></div></div>
          </div>

          <!-- 07 only: the pinned pills over the top of the feed -->
          <div class="f07-pills">
            <div id="f07-pill-org" class="f07-pill">ORGANIQUE<div id="f07-pill-glow" class="f07-pill-glow"></div><div id="f07-pill-lit" class="f07-pill-lit">ORGANIQUE</div></div>
            <div id="f07-pill-pub" class="f07-pill"><span id="f07-pub-txt">PUB</span><svg class="f07-pub-svg" viewBox="0 0 158 66" xmlns="http://www.w3.org/2000/svg"><path id="f07-pub-strike" d="M 10 45 L 148 21"></path></svg></div>

    <div id="f07-sub" class="f07-sub">
      <div class="f07-chunk" data-out="0.80"><span class="f07-w" data-cue="0.15">En</span> <span class="f07-w f07-key" data-cue="0.27">organique,</span></div>
      <div class="f07-chunk" data-out="1.55"><span class="f07-w" data-cue="0.93">pas</span> <span class="f07-w" data-cue="1.07">en</span> <span class="f07-w" data-cue="1.22">pub.</span></div>
      <div class="f07-chunk" data-out="2.40"><span class="f07-w" data-cue="1.67">On</span> <span class="f07-w" data-cue="1.79">achète</span> <span class="f07-w" data-cue="2.03">à</span> <span class="f07-w" data-cue="2.16">quelqu'un</span></div>
      <div class="f07-chunk"><span class="f07-w" data-cue="2.52">qu'on</span> <span class="f07-w" data-cue="2.76">a</span> <span class="f07-w" data-cue="2.88">déjà</span> <span class="f07-w" data-cue="3.13">vu</span> <span class="f07-w f07-key" data-cue="3.25">bosser.</span></div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FID = "07-organique";
      var DUR = 3.64;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      function $(id) { return root.querySelector("#" + id); }
      var tl = gsap.timeline({ paused: true });

      /* ===================== SHARED: title (JS) ===================== */
      // Title slam: scale 1.25 -> 1, blur 10 -> 0, 0.18 s expo.out (t0 > 0: the element starts at opacity 0 in CSS).
      function f07TitleIn(tl, el, t0) {
        tl.fromTo(el, { opacity: 0, scale: 1.25, filter: "blur(10px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, t0);
      }
      // Orange stroke: draws from the left, scaleX 0 -> 1, 0.3 s power3.out.
      function f07StrokeDraw(tl, el, t0) {
        tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t0);
      }
      /* ===================== end SHARED: title (JS) ===================== */

      /* ===================== SHARED: subtitle (JS) ===================== */
      // Each word appears 1 frame before its cue (never late): opacity 0 -> 1, y 14 -> 0, blur 6 -> 0 in 0.12 s.
      // The key word turns #FB8000 as it appears. A chunk leaves at its data-out in 0.1 s (opacity + blur).
      var F07_LEAD = 1 / 30;
      function f07Subtitle(tl, box) {
        Array.prototype.forEach.call(box.querySelectorAll(".f07-chunk"), function (ch) {
          Array.prototype.forEach.call(ch.querySelectorAll(".f07-w"), function (w) {
            var t = Math.max(0, parseFloat(w.getAttribute("data-cue")) - F07_LEAD);
            tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            if (w.classList.contains("f07-key")) {
              tl.fromTo(w, { color: "#ffffff" }, { color: "#FB8000", duration: 0.12, ease: "power3.out", immediateRender: false }, t);
            }
          });
          var out = ch.getAttribute("data-out");
          if (out) {
            tl.fromTo(ch, { opacity: 1, filter: "blur(0px)" },
              { opacity: 0, filter: "blur(6px)", duration: 0.1, ease: "power3.out", immediateRender: false }, parseFloat(out));
          }
        });
      }
      /* ===================== end SHARED: subtitle (JS) ===================== */

      /* ===================== SHARED: card (JS) ===================== */
      // French thousands: « 9 800 »
      function f07Fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
      var FEED_SPEED = 60;          // px/s, upward (state inherited from 06 @ 4.80)
      /* ===================== end SHARED: card (JS) ===================== */

      /* ---- camera track: continues 06 (push 1.048, cran 1.02 at 0.00) ---- */
      tl.fromTo($("f07-push"), { scale: 1.048 }, { scale: 1.048 + 0.01 * DUR, duration: DUR, ease: "none" }, 0);
      tl.fromTo($("f07-cran"), { y: 0 }, { y: -24, duration: DUR, ease: "none" }, 0);
      tl.fromTo($("f07-cran"), { scale: 1.02 }, { scale: 1.02, duration: 0.01, ease: "none" }, 0);
      // 3.25 a small step in on the frozen post
      tl.fromTo($("f07-cran"), { scale: 1.02 }, { scale: 1.028, duration: 0.3, ease: "power3.out", immediateRender: false }, 3.25);

      /* ---- feed: 06's state at 0.00, drift 60 px/s, then the fast scroll that freezes post 10 at 3.25 ---- */
      var FAST_AT = 1.67, FREEZE_AT = 3.25, FAST = FREEZE_AT - FAST_AT;
      var D0 = -178.2, D1 = D0 - FEED_SPEED * FAST_AT, D2 = D1 - FEED_SPEED * FAST / 2;   // power1.out starts at 60 px/s
      var S0 = -975, S1 = 91 - 374 * 10 - D2;                                               // post 10 top at window y 91
      tl.fromTo($("f07-drift"), { y: D0 }, { y: D1, duration: FAST_AT, ease: "none" }, 0);
      tl.fromTo($("f07-drift"), { y: D1 }, { y: D2, duration: FAST, ease: "power1.out", immediateRender: false }, FAST_AT);
      tl.fromTo($("f07-step"), { y: S0 }, { y: S0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($("f07-step"), { y: S0 }, { y: S1, duration: FAST, ease: "power2.inOut", immediateRender: false }, FAST_AT);
      // speed blur at the peak of the scroll
      tl.fromTo($("f07-step"), { filter: "blur(0px)" }, { filter: "blur(3px)", duration: 0.4, ease: "power3.out", immediateRender: false }, 2.10);
      tl.fromTo($("f07-step"), { filter: "blur(3px)" }, { filter: "blur(0px)", duration: 0.45, ease: "power3.out", immediateRender: false }, 2.62);

      /* ---- halo: 06's state (scale 1.10), then follows the focal ---- */
      tl.fromTo($("f07-halo"), { scale: 1.10, y: 0 }, { scale: 1.10, y: 0, duration: 0.01, ease: "none" }, 0);
      tl.fromTo($("f07-halo"), { scale: 1.10, y: 0 }, { scale: 1.18, y: -220, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.27);
      tl.fromTo($("f07-halo"), { scale: 1.18, y: -220 }, { scale: 1.12, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 2.52);
      tl.fromTo($("f07-halo"), { scale: 1.12 }, { scale: 1.2, duration: 0.35, ease: "power3.out", immediateRender: false }, 3.25);

      /* ---- 0.10 the « ORGANIQUE » pill lands (dark), 0.27 it lights up in accent ---- */
      var org = $("f07-pill-org");
      tl.fromTo(org, { opacity: 0, scale: 1.3, filter: "blur(8px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out", immediateRender: false }, 0.10);
      tl.fromTo($("f07-pill-lit"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, 0.26);
      tl.fromTo($("f07-pill-glow"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.26);
      tl.fromTo(org, { scale: 1 }, { scale: 1.12, duration: 0.08, ease: "power3.out", immediateRender: false }, 0.26);
      tl.fromTo(org, { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.34);

      /* ---- 0.93 the « PUB » pill appears, 1.22 it is struck through (svg path draw) and dims ---- */
      var pub = $("f07-pill-pub");
      tl.fromTo(pub, { opacity: 0, x: 60, scale: 1.2, filter: "blur(8px)" },
        { opacity: 1, x: 0, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, 0.90);
      var strike = $("f07-pub-strike");
      var len = 145;
      try { len = Math.ceil(strike.getTotalLength()) + 1; } catch (e) {}
      strike.style.strokeDasharray = len;
      strike.style.strokeDashoffset = len;
      tl.fromTo(strike, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, 1.20);
      tl.fromTo($("f07-pub-txt"), { opacity: 1 }, { opacity: 0.4, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.30);
      tl.fromTo(pub, { x: 0 }, { x: 7, duration: 0.04, ease: "sine.out", immediateRender: false }, 1.30);
      tl.fromTo(pub, { x: 7 }, { x: -6, duration: 0.08, ease: "sine.inOut", immediateRender: false }, 1.34);
      tl.fromTo(pub, { x: -6 }, { x: 3, duration: 0.08, ease: "sine.inOut", immediateRender: false }, 1.42);
      tl.fromTo(pub, { x: 3 }, { x: 0, duration: 0.06, ease: "sine.out", immediateRender: false }, 1.50);
      tl.fromTo(pub, { scale: 1 }, { scale: 0.92, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.30);

      /* ---- 2.16 the views counter rolls 9 800 -> 18 600 (counting-dynamic-scale, seek-safe: no onUpdate) ---- */
      // a strip of rows (64 px) rolled by y; the power3.out ease is quantised to whole rows.
      var num = $("f07-num");
      var ROWS = 33, html = "";
      for (var i = 0; i <= ROWS; i++) {
        var v = 9800 + Math.round(8800 * i / ROWS / 10) * 10;
        if (i > 0 && i < ROWS) v += (i * 37) % 10;
        html += "<span>" + f07Fmt(v) + "</span>";
      }
      num.innerHTML = html;
      var p3 = gsap.parseEase("power3.out");
      var rowEase = function (t) { return Math.round(p3(t) * ROWS) / ROWS; };
      tl.fromTo(num, { y: 0 }, { y: -ROWS * 64, duration: 1.1, ease: rowEase, immediateRender: false }, 2.16);
      tl.fromTo($("f07-num-box"), { scale: 1 }, { scale: 1.15, duration: 1.1, ease: "power3.out", immediateRender: false }, 2.16);

      /* ---- 2.52 the lit pill pulses once more ---- */
      tl.fromTo(org, { scale: 1 }, { scale: 1.07, duration: 0.1, ease: "power3.out", immediateRender: false }, 2.52);
      tl.fromTo(org, { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.62);

      /* ---- 3.25 « bosser »: post « CLIENT LIVRÉ » frozen in the centre, accent heart ---- */
      tl.fromTo($("f07-bigheart"), { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, 3.22);
      tl.fromTo($("f07-heart10"), { opacity: 0, scale: 1.8 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out", immediateRender: false }, 3.28);

      /* ---- the voice, word by word ---- */
      f07Subtitle(tl, $("f07-sub"));

      // exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
