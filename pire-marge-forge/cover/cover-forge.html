<!doctype html><html><head><meta charset="utf-8"><style>
/* Cover FORGE: crème #F8F6F3 et bronze #8B7355 sur noir #0A0A0A, Fujecka. Titre dans le recadrage 4:5 central (y 285 à 1635). */
@font-face { font-family: "Fujecka Titre"; src: url("FUJECKA-ExtraBold.ttf") format("truetype"); }
@font-face { font-family: "Fujecka Texte"; src: url("FUJECKA-Bold.ttf") format("truetype"); }
html, body { margin: 0; background: #0A0A0A; }
#c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A0A0A; }
#hero { position: absolute; left: 0; top: 0; width: 1080px; height: 1240px; object-fit: cover; filter: saturate(0.8) contrast(1.05); }
#fade { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
  background: linear-gradient(rgba(10,10,10,0.75) 0%, rgba(10,10,10,0.1) 18%, rgba(10,10,10,0) 30%, rgba(10,10,10,0.6) 44%, #0A0A0A 60%); }
#hook { position: absolute; left: 0; top: 330px; width: 1080px; text-align: center; }
#hook span { display: inline-block; padding: 12px 34px; border: 2px solid #8B7355; border-radius: 6px; background: rgba(10,10,10,0.72);
  color: #F8F6F3; font: 46px/1.2 "Fujecka Texte", sans-serif; letter-spacing: 0.06em; }
#t { position: absolute; left: 0; top: 760px; width: 1080px; text-align: center; color: #F8F6F3; font: 172px/1.02 "Fujecka Titre", sans-serif;
  text-shadow: 0 10px 50px rgba(0,0,0,0.6); }
#rule { position: absolute; left: 240px; top: 1110px; width: 600px; height: 6px; background: #8B7355; }
#s { position: absolute; left: 0; top: 1150px; width: 1080px; text-align: center; color: #F8F6F3; font: 60px/1.1 "Fujecka Texte", sans-serif; letter-spacing: 0.04em; }
.tile { position: absolute; top: 1290px; width: 320px; height: 330px; overflow: hidden; border: 2px solid #8B7355; border-radius: 6px; background: #0A0A0A; }
.tile img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(0.8) contrast(1.04); }
#logo { position: absolute; left: 390px; top: 1700px; width: 300px; }
</style></head><body><div id="c"><img id="hero" src="achat.jpg" style="object-position:50% 70%"><div id="fade"></div>
<div id="hook"><span>FERRARI 360 MODENA</span></div>
<div id="t">MA PIRE<br>MARGE</div><div id="rule"></div><div id="s">EN 16 ANS DE MÉTIER</div>
<div class="tile" style="left:30px"><img src="ph-moteur19.jpg"></div><div class="tile" style="left:380px"><img src="ph-interieur.jpg"></div><div class="tile" style="left:730px"><img src="ph-feux.jpg"></div>
<img id="logo" src="forge-entete-fond-sombre.svg"></div></body></html>
